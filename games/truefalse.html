<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True or False — LotusWall</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="common/ui-spritesheet.css">
  <link rel="stylesheet" href="common/themes.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
    body { background: #f7f5f0; min-height: 100vh; color: #18181b; display: flex; flex-direction: column; overflow-x: hidden; position: relative; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: #ffffff; border-bottom: 1.5px solid #e5dfd3; color: #18181b; position: relative; z-index: 10; gap: 8px; flex-wrap: wrap; }
    .stat-badge { background: #fcfbf8; border: 1.5px solid #d6cfc2; color: #18181b; padding: 7px 14px; border-radius: 8px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(24,24,27,0.04); }
    .hearts { gap: 4px; }
    .heart { display: inline-flex; align-items: center; justify-content: center; }
    .heart.lost { opacity: 0.25; filter: grayscale(1); }

    .game-area { flex: 1; width: 96%; max-width: 1480px; margin: 0 auto; padding: 24px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10; }
    
    .card-statement {
      background: #ffffff;
      border: 2px solid #d6cfc2;
      border-radius: 14px;
      padding: 40px 36px;
      width: 100%;
      text-align: center;
      margin-bottom: 30px;
      box-shadow: 0 2px 10px rgba(24,24,27,0.05);
      animation: popCard 0.25s ease-out;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    @keyframes popCard { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .statement-num { font-size: 12px; text-transform: uppercase; letter-spacing: 1.6px; color: #57534e; font-weight: 800; margin-bottom: 10px; }
    .statement-text { font-size: clamp(20px, 2.2vw, 28px); max-width: 1040px; margin: 0 auto; font-weight: 700; line-height: 1.4; color: #18181b; }

    .card-statement.correct-flash {
      box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.25);
      border-color: #15803d;
    }
    .card-statement.wrong-flash {
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.25);
      border-color: #dc2626;
      animation: shakeCard 0.4s ease-in-out;
    }
    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Action Buttons */
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; width: 100%; position: relative; }
    
    .choice-btn {
      position: relative;
      padding: 28px 24px;
      min-height: 120px;
      border-radius: 12px;
      border: 2px solid transparent;
      border-bottom-width: 5px;
      font-size: 22px;
      font-weight: 800;
      color: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, background 0.15s ease, opacity 0.2s ease;
      overflow: visible;
    }
    @media (max-width: 520px) {
      .game-area { width: 100%; padding: 16px; }
      .card-statement { padding: 24px 18px; }
      .btn-group { grid-template-columns: 1fr; gap: 14px; }
      .choice-btn { min-height: 92px; padding: 18px; }
    }
    .btn-true { background: #15803d; border-color: #14532d; }
    .btn-false { background: #dc2626; border-color: #991b1b; }
    
    .choice-btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.04); }
    .choice-btn:active:not(:disabled) { transform: translateY(1px); }

    .choice-btn.is-correct-btn {
      border-color: #facc15 !important;
      animation: pulseCorrect 0.4s ease-in-out infinite alternate;
      z-index: 15;
    }
    @keyframes pulseCorrect {
      0% { transform: scale(1.02); }
      100% { transform: scale(1.04); }
    }

    .choice-btn.is-wrong-btn {
      transform: scale(0.98);
      border-color: #fca5a5 !important;
      animation: shakeWrong 0.4s both;
      z-index: 15;
    }
    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .choice-btn.dimmed { opacity: 0.45; transform: scale(0.97); pointer-events: none; }

    /* Star Animation FX Layer */
    .star-fx-container { position: fixed; inset: 0; pointer-events: none; z-index: 100; overflow: hidden; }
    .star-particle { position: absolute; pointer-events: none; user-select: none; will-change: transform, opacity; display: flex; align-items: center; justify-content: center; animation: burstAndFade var(--duration, 950ms) cubic-bezier(0.12, 0.8, 0.32, 1) forwards; }
    @keyframes burstAndFade {
      0% { transform: translate(-50%, -50%) translate(0, 0) scale(0.2) rotate(0deg); opacity: 0; }
      15% { opacity: 1; transform: translate(-50%, -50%) translate(calc(var(--dx) * 0.4), calc(var(--dy) * 0.4)) scale(var(--target-scale, 1.25)) rotate(calc(var(--rot) * 0.25)); }
      65% { opacity: 0.95; transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(calc(var(--target-scale, 1.25) * 0.9)) rotate(calc(var(--rot) * 0.75)); }
      100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--dx), calc(var(--dy) - 40px)) scale(0.3) rotate(var(--rot)); }
    }
    .star-shockwave { position: absolute; width: 120px; height: 120px; border-radius: 9999px; border: 4px solid #facc15; pointer-events: none; animation: shockwaveExpand 750ms cubic-bezier(0.2, 0.8, 0.25, 1) forwards; }
    @keyframes shockwaveExpand {
      0% { transform: translate(-50%, -50%) scale(0.25); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
    }
    .score-float-tag { position: absolute; transform: translate(-50%, -50%); color: #d97706; font-size: 26px; font-weight: 800; pointer-events: none; animation: floatScoreTag 950ms cubic-bezier(0.22, 1, 0.36, 1) forwards; display: flex; align-items: center; gap: 6px; letter-spacing: 0.6px; }
    @keyframes floatScoreTag {
      0% { transform: translate(-50%, -50%) translateY(0) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -50%) translateY(-25px) scale(1.2); opacity: 1; }
      70% { transform: translate(-50%, -50%) translateY(-60px) scale(1.05); opacity: 0.95; }
      100% { transform: translate(-50%, -50%) translateY(-95px) scale(0.7); opacity: 0; }
    }

    .screen-overlay { position: fixed; inset: 0; background: rgba(24, 24, 27, 0.72); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; padding: 24px; }
    .end-box { background: #ffffff; border: 2px solid #d6cfc2; color: #18181b; border-radius: 14px; padding: 36px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 20px 45px rgba(24,24,27,0.24); }
    .end-sub { color: #57534e; margin-bottom: 20px; }
    .end-score-card { background: #fcfbf8; border: 1.5px solid #e5dfd3; padding: 18px; border-radius: 10px; margin-bottom: 18px; }
    .end-score-val { font-size: 34px; font-weight: 800; color: #15803d; }
    .action-btn { background: #1d4ed8; color: white; border: none; border-bottom: 3px solid #1e3a8a; padding: 12px 32px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; }
    .action-btn:hover { background: #1e40af; }
  </style>
</head>
<body class="theme-white">

  <!-- Hidden SVG Defs for Star Gradients -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1">
    <defs>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fffbeb" />
        <stop offset="30%" stop-color="#fde047" />
        <stop offset="70%" stop-color="#eab308" />
        <stop offset="100%" stop-color="#ca8a04" />
      </linearGradient>
    </defs>
  </svg>

  <!-- Container for Star Burst FX -->
  <div id="star-fx-container" class="star-fx-container"></div>

  <div class="top-bar">
    <div class="stat-badge">
      <span class="ui-sprite ui-sm ui-game-tf hud-icon-white"></span>
      <span data-i18n="tf.title">True or False</span>
    </div>
    <div class="stat-badge" id="score-badge">
      <span class="ui-sprite ui-sm ui-trophy hud-icon-white"></span>
      <span><span data-i18n="game.score">Score</span>: <span id="score-val">0</span></span>
    </div>
    <div class="stat-badge" id="timer-badge" style="display: none;">
      <span class="ui-sprite ui-sm ui-clock hud-icon-white"></span>
      <span><span id="lbl-time">Time</span>: <span id="timer-val">0</span>s</span>
    </div>
    <div class="stat-badge hearts" id="lives-badge"></div>
  </div>

  <main class="game-area">
    <div class="card-statement" id="card-statement">
      <div class="statement-num" id="stmt-num">Statement 1 of 5</div>
      <div class="statement-text" id="stmt-text">Loading Activity...</div>
    </div>

    <div class="btn-group">
      <button id="btn-true" class="choice-btn btn-true" onclick="handleChoice(true)">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,0.2);">
          <span class="ui-sprite ui-lg ui-check"></span>
        </span>
        <span data-i18n="tf.true">TRUE</span>
      </button>
      <button id="btn-false" class="choice-btn btn-false" onclick="handleChoice(false)">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,0.2);">
          <span class="ui-sprite ui-lg ui-close"></span>
        </span>
        <span data-i18n="tf.false">FALSE</span>
      </button>
    </div>
  </main>

  <div class="screen-overlay" id="end-screen" style="display: none;">
    <div class="end-box">
      <div style="margin-bottom: 12px; display:flex; justify-content:center;">
        <span class="ui-sprite ui-2xl ui-trophy"></span>
      </div>
      <h2 id="end-title" style="font-size: 26px; font-weight: 800; margin-bottom: 8px;" data-i18n="tf.allDoneTitle">Challenge Complete!</h2>
      <p id="end-sub" class="end-sub" data-i18n="tf.allDoneSub">You have completed all statements.</p>
      
      <div class="end-score-card">
        <div class="end-score-val" id="final-score">0 pts</div>
      </div>

      <button class="action-btn" onclick="initGame()" data-i18n="game.playAgain">Play Again</button>
    </div>
  </div>

  <script src="common/i18n.js"></script>
  <script src="common/sfx.js"></script>
  <script src="common/confetti.js"></script>
  <script src="common/themes.js"></script>
  <script src="common/bridge.js"></script>
  <script>
    const tr = (k, v) => (window.LotusI18n ? LotusI18n.t(k, v) : k);

    let activity = null;
    let statements = [];
    let currentIndex = 0;
    let score = 0;
    let maxLives = 3;
    let lives = 3;
    let isProcessing = false;
    let timeMode = 'none';
    let timerDuration = 30;
    let timeLeft = 30;
    let stopwatchSeconds = 0;
    let timerInterval = null;
    let nextStmtTimeout = null;
    let hasBootedOnce = false;
    let lastActivitySig = '';
    let lastSettingsSyncTs = 0;
    const processedBridgeMsgs = new WeakSet();

    function syncStaticTexts() {
      document.title = tr('tf.pageTitle');
      if (window.LotusI18n) LotusI18n.applyDomTranslations(document);
      const lblTime = document.getElementById('lbl-time');
      if (lblTime) lblTime.innerText = timeMode === 'stopwatch' ? tr('game.stopwatch') : tr('game.time');
    }

    if (window.LotusI18n) {
      LotusI18n.onChange(() => {
        syncStaticTexts();
        if (statements.length > 0 && currentIndex < statements.length) {
          const s = statements[currentIndex];
          const stmtNum = document.getElementById('stmt-num');
          if (stmtNum) stmtNum.innerText = tr('tf.stmtNum', { cur: currentIndex + 1, tot: statements.length });
          const stmtText = document.getElementById('stmt-text');
          if (stmtText && s.prompt) {
            stmtText.innerText = `${s.prompt} -> ${tr('tf.stmtPrefix')} ${s.shownAns}`;
          }
        }
        if (document.getElementById('end-screen').style.display !== 'none') {
          const outOfLives = maxLives > 0 && lives <= 0;
          const endTitle = document.getElementById('end-title');
          const endSub = document.getElementById('end-sub');
          if (endTitle) endTitle.innerText = outOfLives ? tr('game.outOfLivesTitle') : tr('tf.allDoneTitle');
          if (endSub) endSub.innerText = outOfLives ? tr('game.outOfLivesSub') : tr('tf.allDoneSub');
          const finalScore = document.getElementById('final-score');
          if (finalScore) finalScore.innerText = tr('game.totalPoints', { n: score });
        }
      });
    }

    const bridge = window.GameBridge || (typeof GameBridge !== 'undefined' ? GameBridge : null);

    function computeActivitySig(act) {
      if (!act) return '';
      const qLen = (act.questions || act.content?.items || []).length;
      return JSON.stringify({
        id: act.id || '',
        title: act.title || '',
        qLen,
        rules: act.rules || null,
        settings: act.settings || null,
        theme: act.theme || ''
      });
    }

    function applyMergedSettings(payload) {
      if (!payload) return;
      const base = payload.activity ? { ...payload.activity } : { ...(activity || {}) };
      if (payload.rules) base.rules = { ...(base.rules || {}), ...payload.rules };
      if (payload.settings) base.settings = { ...(base.settings || {}), ...payload.settings };
      if (payload.theme) base.theme = payload.theme;
      if (base.rules) {
        base.settings = {
          ...(base.settings || {}),
          timerSeconds: base.rules.timerSeconds ?? base.settings?.timerSeconds ?? 30,
          lives: base.rules.hasLives === false ? 0 : (base.rules.livesCount ?? base.settings?.lives ?? 3),
          hasLives: base.rules.hasLives,
          timeMode: base.rules.timeMode,
          shuffle: base.rules.shuffleQuestions,
          shuffleAnswers: base.rules.shuffleAnswers
        };
      }
      const norm = (bridge && typeof bridge.normalizeActivity === 'function') ? bridge.normalizeActivity(base) : base;
      activity = norm;
      if (bridge) bridge.activity = norm;
      lastActivitySig = computeActivitySig(norm);
      if (payload.theme && window.LotusThemes) LotusThemes.apply(payload.theme, true);
      else if (norm.theme && window.LotusThemes) LotusThemes.apply(norm.theme);
      if (payload.restart !== false) initGame();
    }

    function handleExternalMessage(data) {
      if (!data || typeof data !== 'object') return;
      if (data.type === 'GAME_CMD') {
        const cmd = data.command || data.cmd;
        if (cmd === 'RESTART') initGame();
      } else if (data.type === 'UPDATE_SETTINGS') {
        lastSettingsSyncTs = Date.now();
        applyMergedSettings(data);
      } else if (data.type === 'GAME_SETTINGS') {
        lastSettingsSyncTs = Date.now();
        const p = data.payload && typeof data.payload === 'object' ? { ...data, ...data.payload } : data;
        if (p.rules || p.settings || p.activity || p.theme) applyMergedSettings(p);
      } else if (data.type === 'INIT_ACTIVITY' && data.activity) {
        const norm = (bridge && typeof bridge.normalizeActivity === 'function') ? bridge.normalizeActivity(data.activity) : data.activity;
        const sig = computeActivitySig(norm);
        if (!hasBootedOnce || sig !== lastActivitySig || data.forceRestart || data.restart === true) {
          activity = norm;
          if (bridge) bridge.activity = norm;
          lastActivitySig = sig;
          hasBootedOnce = true;
          initGame();
        }
      }
    }

    if (bridge && typeof bridge.onReady === 'function') {
      bridge.onReady((act) => {
        if (hasBootedOnce && (Date.now() - lastSettingsSyncTs) < 50) return;
        activity = act;
        lastActivitySig = computeActivitySig(act);
        hasBootedOnce = true;
        initGame();
      });
      if (typeof bridge.onSettings === 'function') {
        bridge.onSettings((payload) => {
          if (payload && typeof payload === 'object') processedBridgeMsgs.add(payload);
          handleExternalMessage(payload);
        });
      }
    } else {
      setTimeout(() => { hasBootedOnce = true; initGame(); }, 100);
    }

    const hasBridgeSettings = Boolean(bridge && typeof bridge.onSettings === 'function');
    window.addEventListener('message', (event) => {
      if (!event.data || typeof event.data !== 'object') return;
      if (processedBridgeMsgs.has(event.data)) return;
      if (hasBridgeSettings && (event.data.type === 'UPDATE_SETTINGS' || event.data.type === 'GAME_SETTINGS' || event.data.type === 'GAME_CMD')) {
        return;
      }
      processedBridgeMsgs.add(event.data);
      handleExternalMessage(event.data);
    });

    function initGame() {
      clearInterval(timerInterval);
      clearTimeout(nextStmtTimeout);

      let items = (activity && activity.content && activity.content.items) || [];
      if (items.length === 0 && Array.isArray(activity?.questions)) {
        items = activity.questions.map(q => {
          const right = (q.options || []).find(o => o.isCorrect);
          const wrongs = (q.options || []).filter(o => !o.isCorrect).map(o => o.text);
          return {
            question: q.text || q.question,
            correctAnswer: right ? right.text : '',
            wrongAnswers: wrongs
          };
        });
      }
      if (items.length === 0) {
        const isId = (window.LotusI18n && LotusI18n.getLang() === 'id');
        items = isId
          ? [
              { question: 'Ibu kota negara Indonesia', correctAnswer: 'Jakarta', wrongAnswers: ['Surabaya'] },
              { question: 'Hasil dari 6 x 7', correctAnswer: '42', wrongAnswers: ['48'] }
            ]
          : [
              { question: 'Largest planet in our solar system', correctAnswer: 'Jupiter', wrongAnswers: ['Mars'] },
              { question: 'Result of 6 x 7', correctAnswer: '42', wrongAnswers: ['48'] }
            ];
      }

      const rules = activity?.rules || {};
      const settings = activity?.settings || {};

      if (window.LotusThemes) LotusThemes.apply(activity?.theme || 'white');

      statements = [];
      items.forEach(item => {
        const isTrue = Math.random() > 0.5;
        if (isTrue) {
          statements.push({
            prompt: item.question,
            shownAns: item.correctAnswer,
            text: `${item.question} -> ${tr('tf.stmtPrefix')} ${item.correctAnswer}`,
            isCorrect: true
          });
        } else {
          const wrong = (item.wrongAnswers && item.wrongAnswers[0]) || tr('tf.wrongFallback');
          statements.push({
            prompt: item.question,
            shownAns: wrong,
            text: `${item.question} -> ${tr('tf.stmtPrefix')} ${wrong}`,
            isCorrect: false
          });
        }
      });

      if (rules.shuffleQuestions !== false && settings.shuffle !== false) {
        statements.sort(() => Math.random() - 0.5);
      }

      const hasLives = rules.hasLives !== undefined
        ? Boolean(rules.hasLives)
        : (settings.hasLives !== undefined ? Boolean(settings.hasLives) : (settings.lives !== undefined ? Number(settings.lives) > 0 : true));
      maxLives = hasLives ? (Number(rules.livesCount ?? settings.lives ?? 3) || 3) : 0;
      lives = maxLives;

      timeMode = rules.timeMode || settings.timeMode || (settings.timerSeconds > 0 ? 'timer' : 'none');
      timerDuration = Number(rules.timerSeconds ?? settings.timerSeconds ?? 30);
      if (timerDuration <= 0 && timeMode === 'timer') timerDuration = 30;
      timeLeft = timerDuration;
      stopwatchSeconds = 0;

      syncStaticTexts();

      const timerBadge = document.getElementById('timer-badge');
      const timerVal = document.getElementById('timer-val');
      if (timeMode === 'none') {
        if (timerBadge) timerBadge.style.setProperty('display', 'none', 'important');
      } else if (timeMode === 'stopwatch') {
        if (timerBadge) {
          timerBadge.style.removeProperty('display');
          timerBadge.style.display = 'inline-flex';
        }
        if (timerVal) timerVal.innerText = '0';
        timerInterval = setInterval(() => {
          stopwatchSeconds++;
          if (timerVal) timerVal.innerText = String(stopwatchSeconds);
        }, 1000);
      } else {
        if (timerBadge) {
          timerBadge.style.removeProperty('display');
          timerBadge.style.display = 'inline-flex';
        }
      }

      currentIndex = 0;
      score = 0;
      updateLives();
      const scoreVal = document.getElementById('score-val');
      if (scoreVal) scoreVal.innerText = score;
      const endScreen = document.getElementById('end-screen');
      if (endScreen) endScreen.style.display = 'none';

      loadStatement(0);
    }

    function updateLives() {
      const livesBadge = document.getElementById('lives-badge');
      if (!livesBadge) return;
      if (maxLives <= 0) {
        livesBadge.style.setProperty('display', 'none', 'important');
        livesBadge.innerHTML = '';
        return;
      }
      livesBadge.style.removeProperty('display');
      livesBadge.style.display = 'inline-flex';
      let s = '';
      for (let i = 0; i < maxLives; i++) {
        const lostCls = i < lives ? '' : ' lost';
        s += `<span class="heart${lostCls}"><span class="ui-sprite ui-sm ui-heart hud-icon-white"></span></span>`;
      }
      livesBadge.innerHTML = s;
    }

    function startStatementTimer() {
      if (timeMode !== 'timer') return;
      clearInterval(timerInterval);
      timeLeft = timerDuration;
      const timerVal = document.getElementById('timer-val');
      if (timerVal) timerVal.innerText = String(timeLeft);
      timerInterval = setInterval(() => {
        if (isProcessing) return;
        timeLeft--;
        if (timerVal) timerVal.innerText = String(Math.max(0, timeLeft));
        if (timeLeft <= 5 && timeLeft > 0 && typeof SFX !== 'undefined' && SFX.tick) SFX.tick();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function handleTimeout() {
      if (isProcessing) return;
      isProcessing = true;
      if (typeof SFX !== 'undefined' && SFX.wrong) SFX.wrong();
      if (maxLives > 0) {
        lives = Math.max(0, lives - 1);
        updateLives();
      }
      const cardEl = document.getElementById('card-statement');
      if (cardEl && cardEl.classList) cardEl.classList.add('wrong-flash');
      clearTimeout(nextStmtTimeout);
      nextStmtTimeout = setTimeout(() => {
        currentIndex++;
        loadStatement(currentIndex);
      }, 950);
    }

    function loadStatement(idx) {
      const btnTrue = document.getElementById('btn-true');
      const btnFalse = document.getElementById('btn-false');
      const cardEl = document.getElementById('card-statement');

      if (btnTrue && btnTrue.classList) btnTrue.classList.remove('is-correct-btn', 'is-wrong-btn', 'dimmed');
      if (btnFalse && btnFalse.classList) btnFalse.classList.remove('is-correct-btn', 'is-wrong-btn', 'dimmed');
      if (cardEl) {
        if (cardEl.classList) cardEl.classList.remove('correct-flash', 'wrong-flash');
        if (cardEl.style) {
          cardEl.style.animation = 'none';
          void cardEl.offsetWidth;
          cardEl.style.animation = '';
        }
      }

      if (idx >= statements.length || (maxLives > 0 && lives <= 0)) {
        endGame();
        return;
      }

      isProcessing = false;
      const stmt = statements[idx];
      const stmtNum = document.getElementById('stmt-num');
      if (stmtNum) stmtNum.innerText = tr('tf.stmtNum', { cur: idx + 1, tot: statements.length });
      const stmtText = document.getElementById('stmt-text');
      if (stmtText) stmtText.innerText = `${stmt.prompt} -> ${tr('tf.stmtPrefix')} ${stmt.shownAns}`;
      startStatementTimer();
    }

    function spawnStarBurst(targetEl) {
      const container = document.getElementById('star-fx-container') || document.body;
      if (!targetEl || !container) return;

      let centerX = window.innerWidth / 2;
      let centerY = window.innerHeight / 2;

      if (typeof targetEl.getBoundingClientRect === 'function') {
        const rect = targetEl.getBoundingClientRect();
        centerX = rect.left + rect.width / 2;
        centerY = rect.top + rect.height / 2;
      }

      const ring = document.createElement('div');
      ring.className = 'star-shockwave';
      ring.style.left = centerX + 'px';
      ring.style.top = centerY + 'px';
      container.appendChild(ring);
      setTimeout(() => { if (ring.parentNode) ring.parentNode.removeChild(ring); }, 750);

      const scoreTag = document.createElement('div');
      scoreTag.className = 'score-float-tag';
      scoreTag.innerHTML = '+100 <span class="ui-sprite ui-md ui-sparkles"></span>';
      scoreTag.style.left = centerX + 'px';
      scoreTag.style.top = (centerY - 10) + 'px';
      container.appendChild(scoreTag);
      setTimeout(() => { if (scoreTag.parentNode) scoreTag.parentNode.removeChild(scoreTag); }, 950);

      const starSVGs = [
        '<svg viewBox="0 0 24 24" width="100%" height="100%"><polygon points="12,1.5 15.3,8.2 22.7,9.3 17.3,14.6 18.6,22 12,18.5 5.4,22 6.7,14.6 1.3,9.3 8.7,8.2" fill="url(#goldGrad)" stroke="#f59e0b" stroke-width="1.2" filter="drop-shadow(0 0 6px rgba(250,204,21,0.95))"/></svg>',
        '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 1 L14.5 9.5 L23 12 L14.5 14.5 L12 23 L9.5 14.5 L1 12 L9.5 9.5 Z" fill="url(#goldGrad)" stroke="#facc15" stroke-width="0.8" filter="drop-shadow(0 0 8px rgba(253,224,71,0.9))"/></svg>'
      ];

      const particleCount = 16;
      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.className = 'star-particle';
        const baseAngle = (i / particleCount) * Math.PI * 2;
        const angle = baseAngle + (Math.random() - 0.5) * 0.4;
        const distance = 80 + Math.random() * 120;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance - (30 + Math.random() * 45);
        const rotation = (Math.random() - 0.5) * 600;
        const duration = 800 + Math.random() * 350;
        const delay = Math.random() * 70;
        const size = 22 + Math.random() * 20;
        const scale = 1.0 + Math.random() * 0.45;

        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = centerX + 'px';
        p.style.top = centerY + 'px';
        if (p.style.setProperty) {
          p.style.setProperty('--dx', dx.toFixed(1) + 'px');
          p.style.setProperty('--dy', dy.toFixed(1) + 'px');
          p.style.setProperty('--rot', rotation.toFixed(1) + 'deg');
          p.style.setProperty('--duration', duration.toFixed(0) + 'ms');
          p.style.setProperty('--target-scale', scale.toFixed(2));
        }
        p.style.animationDelay = delay.toFixed(0) + 'ms';
        p.innerHTML = starSVGs[i % starSVGs.length];
        container.appendChild(p);
        setTimeout(() => { if (p.parentNode) p.parentNode.removeChild(p); }, duration + delay + 50);
      }
    }

    function handleChoice(userSaysTrue) {
      if (isProcessing) return;
      isProcessing = true;
      if (timeMode === 'timer') clearInterval(timerInterval);

      const stmt = statements[currentIndex];
      const isCorrect = userSaysTrue === stmt.isCorrect;

      const btnTrue = document.getElementById('btn-true');
      const btnFalse = document.getElementById('btn-false');
      const cardEl = document.getElementById('card-statement');

      const clickedBtn = userSaysTrue ? btnTrue : btnFalse;
      const otherBtn = userSaysTrue ? btnFalse : btnTrue;

      if (isCorrect) {
        if (typeof SFX !== 'undefined' && SFX.correct) SFX.correct();
        score += 100;
        const scoreVal = document.getElementById('score-val');
        if (scoreVal) scoreVal.innerText = score;
        if (clickedBtn && clickedBtn.classList) {
          clickedBtn.classList.add('is-correct-btn');
          spawnStarBurst(clickedBtn);
        }
        if (otherBtn && otherBtn.classList) otherBtn.classList.add('dimmed');
        if (cardEl && cardEl.classList) cardEl.classList.add('correct-flash');
      } else {
        if (typeof SFX !== 'undefined' && SFX.wrong) SFX.wrong();
        if (maxLives > 0) {
          lives = Math.max(0, lives - 1);
          updateLives();
        }
        if (clickedBtn && clickedBtn.classList) clickedBtn.classList.add('is-wrong-btn');
        if (otherBtn && otherBtn.classList) otherBtn.classList.add('dimmed');
        if (cardEl && cardEl.classList) cardEl.classList.add('wrong-flash');
      }

      clearTimeout(nextStmtTimeout);
      nextStmtTimeout = setTimeout(() => {
        currentIndex++;
        loadStatement(currentIndex);
      }, 950);
    }

    function endGame() {
      clearInterval(timerInterval);
      clearTimeout(nextStmtTimeout);
      const outOfLives = maxLives > 0 && lives <= 0;
      if (!outOfLives) {
        if (typeof SFX !== 'undefined' && SFX.win) SFX.win();
        if (window.launchConfetti) window.launchConfetti();
      } else {
        if (typeof SFX !== 'undefined' && SFX.wrong) SFX.wrong();
      }
      if (typeof GameBridge !== 'undefined' && GameBridge.finishGame) {
        GameBridge.finishGame(score, statements.length * 100);
      }
      const endTitle = document.getElementById('end-title');
      const endSub = document.getElementById('end-sub');
      if (endTitle) endTitle.innerText = outOfLives ? tr('game.outOfLivesTitle') : tr('tf.allDoneTitle');
      if (endSub) endSub.innerText = outOfLives ? tr('game.outOfLivesSub') : tr('tf.allDoneSub');
      const finalScore = document.getElementById('final-score');
      if (finalScore) finalScore.innerText = tr('game.totalPoints', { n: score });
      const endScreen = document.getElementById('end-screen');
      if (endScreen) endScreen.style.display = 'flex';
    }
  </script>
</body>
