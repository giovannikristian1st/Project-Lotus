/* Render hearts supporting fractional HP (0.5 increments) */
function _btlHPtoHTML(hp, max, fullE, halfE, emptyE) {
  var html = '';
  for (var i = 0; i < max; i++) {
    /* Each slot represents 1 HP. We compare i+0.5 and i+1 thresholds */
    if (hp >= i + 1) {
      html += '<span class="btl-heart">' + fullE + '</span>';
    } else if (hp >= i + 0.5) {
      html += '<span class="btl-heart">' + halfE + '</span>';
    } else {
      html += '<span class="btl-heart lost">' + emptyE + '</span>';
    }
  }
  return html;
}

function _btlUpdateHP() {
  var heroEl = document.getElementById('btlHeroHearts');
  if (heroEl) heroEl.innerHTML = _btlHPtoHTML(_btlHeroHP, BTL_HERO_MAX_HP, '❤️','🧡','🖤');
  var enEl = document.getElementById('btlEnemyHearts');
  if (enEl)   enEl.innerHTML  = _btlHPtoHTML(_btlEnemyHP, BTL_ENEMY_MAX_HP,'💀','💀','⬛');
}

function _btlSetWaveLabel() {
  var el = document.getElementById('btlWaveLabel');
  if (el) el.textContent = 'Wave ' + _btlWave + ' / ' + BTL_WAVES;
}

function _btlFlashMsg(msg) {
  var el = document.getElementById('btlFlash');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 900);
}

/* ══════════════════════════════════════
   GAME FLOW
══════════════════════════════════════ */

/* Public: player taps ⚔️ Attack button */
function btlSubmitSentence() {
  if (_btlLocked) return;
  if (_btlSentence.length < 1) return;

  var sentence = _btlSentence.map(function(i){ return _btlTilePool[i].char; }).join('');
  var tiles    = _btlSentence.map(function(i){ return _btlTilePool[i]; });

  /* Single-tile attack: skip sentence validation — the word itself is enough */
  if (tiles.length === 1) {
    _btlLocked = true;
    _btlUpdateAttackBtn();
    _btlSetStatus('✦ ' + sentence + ' — solo strike!', 'good');
    var banner = document.getElementById('btlLastWord');
    if (banner) banner.textContent = sentence;
    _btlHeroRushAttack(sentence, 1);
    return;
  }

  /* ── LOCAL POS VALIDATION ──
     Multi-tile: must have at least one verb AND at least one noun/pronoun. */
  var hasVerb    = tiles.some(function(t){ return t.pos === 'verb'; });
  var hasSubject = tiles.some(function(t){ return t.pos === 'noun' || t.pos === 'pronoun'; });

  if (!hasVerb || !hasSubject) {
    var hint = !hasVerb ? 'Need a verb! (e.g. 吃, 去, 是)' : 'Need a subject! (e.g. 我, 你, 人)';
    _btlSetStatus('✗ ' + hint, 'bad');
    return;   /* don't lock — let player adjust tiles */
  }

  _btlLocked = true;
  _btlUpdateAttackBtn();
  _btlSetStatus('✦ Checking…', '');

  _btlValidateSentence(sentence, function(valid, translation) {
    if (!valid) {
      _btlSetStatus('✗ Try a different sentence', 'bad');
      _btlLocked = false;
      _btlUpdateAttackBtn();
      return;
    }
    /* damage scales with tile COUNT (not character length):
       2 tiles=1dmg  3tiles=1dmg  4tiles=2dmg  5tiles=2dmg  6+tiles=3dmg */
    var n   = tiles.length;
    var dmg = n <= 3 ? 1 : (n <= 5 ? 2 : 3);
    var label = translation ? '"' + translation + '"' : sentence;
    _btlSetStatus('✓ ' + label + ' (+' + dmg + '⚔)', 'good');
    /* ── show sentence in word banner ── */
    var banner = document.getElementById('btlLastWord');
    if (banner) banner.textContent = sentence;
    _btlHeroRushAttack(sentence, dmg);
  });
}

/* ── Snap a col element back to home instantly (no transition) ── */
function _btlSnapBack(colEl) {
  if (!colEl) return;
  colEl.classList.add('snap-back');    /* disable transition */
  colEl.classList.remove('rushing');   /* teleport home      */
  /* Re-enable transition on the very next paint */
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      colEl.classList.remove('snap-back');
    });
  });
}

/* Hero runs to col N → attacks → damage enemy → enemy counter-attacks */
function _btlHeroRushAttack(sentence, dmg) {
  var heroCol  = document.getElementById('btlHeroCol');
  var RUN_MS   = 600;   /* time to cross to col N (matches CSS 0.58s) */
  var STAY_MS  = 2000;  /* attack-frame dwell — exactly 2 seconds */

  /* Phase 1 – hero runs right toward column N */
  _btlPlayAnim('hero', 'run', null);
  if (heroCol) heroCol.classList.add('rushing');

  /* Phase 2 – hero arrives at col N: play attack, enemy reacts */
  setTimeout(function() {
    _btlPlayAnim('hero', 'attack', null);
    setTimeout(function() { _btlPlayAnim('enemy', 'hurt', null); }, 160);

    /* Blink hero back to home after attack frame */
    setTimeout(function() {
      _btlSnapBack(heroCol);
    }, STAY_MS);
  }, RUN_MS);

  /* Phase 3 – apply damage (after arrive + stay) */
  setTimeout(function() {
    _btlEnemyHP = Math.max(0, _btlEnemyHP - dmg);
    _btlUpdateHP();
    _btlFlashMsg('⚔️ -' + dmg);

    if (_btlEnemyHP <= 0) {
      _btlPlayAnim('hero', 'idle', null);
      _btlPlayAnim('enemy', 'dead', function() {
        setTimeout(_btlNextEnemy, 500);
      });
    } else {
      _btlPlayAnim('hero',  'idle', null);
      _btlPlayAnim('enemy', 'idle', null);
      setTimeout(_btlEnemyCounterAttack, 500);
    }
  }, RUN_MS + STAY_MS + 180);
}

/* Enemy runs to col C → attacks hero */
function _btlEnemyCounterAttack() {
  /* 50% = 0.5 dmg, 30% = 1, 20% = 1.5 */
  var r   = Math.random();
  var dmg = r < 0.50 ? 0.5 : (r < 0.80 ? 1 : 1.5);
  var dmgLabel = dmg === 0.5 ? '½❤' : (dmg === 1 ? '1❤' : '1½❤');

  var enemyCol = document.getElementById('btlEnemyCol');
  var RUN_MS   = 600;
  var STAY_MS  = 2000;  /* attack-frame dwell — exactly 2 seconds */

  /* Phase 1 – enemy runs left toward column C */
  _btlPlayAnim('enemy', 'run', null);
  if (enemyCol) enemyCol.classList.add('rushing');

  /* Phase 2 – enemy arrives at col C: play attack, hero reacts */
  setTimeout(function() {
    _btlPlayAnim('enemy', 'attack', null);
    setTimeout(function() { _btlPlayAnim('hero', 'hurt', null); }, 160);

    /* Blink enemy back to home after attack frame */
    setTimeout(function() {
      _btlSnapBack(enemyCol);
    }, STAY_MS);
  }, RUN_MS);

  /* Phase 3 – apply damage */
  setTimeout(function() {
    _btlHeroHP = Math.max(0, _btlHeroHP - dmg);
    _btlUpdateHP();
    _btlFlashMsg('💢 -' + dmgLabel);
    _btlPlayAnim('enemy', 'idle', null);

    if (_btlHeroHP <= 0) {
      _btlPlayAnim('hero', 'dead', function() {
        setTimeout(_btlShowResult.bind(null, false), 500);
      });
    } else {
      _btlPlayAnim('hero', 'idle', null);
      /* Unlock; refresh tiles for next turn */
      _btlLocked = false;
      _btlSentence = [];
      _btlBuildTiles();
      _btlSetStatus('Need verb + subject', '');
    }
  }, RUN_MS + STAY_MS + 180);
}

function _btlNextEnemy() {
  if (_btlWave >= BTL_WAVES) {
    _btlShowResult(true);
    return;
  }
  if (_btlEnemyQueue.length === 0) {
    _btlEnemyQueue = BATTLE_ENEMIES.slice();
    for (var i = _btlEnemyQueue.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = _btlEnemyQueue[i];
      _btlEnemyQueue[i] = _btlEnemyQueue[j];
      _btlEnemyQueue[j] = tmp;
    }
  }
  var nextKey = _btlEnemyQueue.shift();
  _btlWave++;
  _btlEnemyHP = BTL_ENEMY_MAX_HP;
  _btlSetWaveLabel();
  _btlUpdateHP();

  _btlLoadImg(nextKey, function(img) {
    _btlEnemyKey = nextKey;
    _btlEnemyImg = img;
    var displayName = BATTLE_NAMES[nextKey] || nextKey;
    var nameEl = document.getElementById('btlEnemyName');
    if (nameEl) nameEl.textContent = displayName;
    var hpNameEl = document.getElementById('btlEnemyHPName');
    if (hpNameEl) hpNameEl.textContent = displayName;
    var descEl = document.getElementById('btlEnemyDesc');
    if (descEl) descEl.textContent = 'Wave ' + _btlWave + ' — defeat this enemy to advance!';
    _btlEnemySt.anim   = 'idle';
    _btlEnemySt.frame  = 0;
    _btlEnemySt.lastTs = 0;
    _btlEnemySt.onDone = null;
    _btlLocked = false;
    _btlSentence = [];
    _btlBuildTiles();
    _btlSetStatus('Need verb + subject', '');
  });
}

function _btlShowResult(won) {
  /* Stop loop */
  if (_btlRAF) { cancelAnimationFrame(_btlRAF); _btlRAF = null; }

  var arena  = document.getElementById('btlArena');
  var result = document.getElementById('btlResult');
  if (arena)  arena.style.display  = 'none';
  if (result) {
    result.style.display = 'flex';
    /* Restart animations by removing and re-adding elements */
    var emoji = document.getElementById('btlResultEmoji');
    var title = document.getElementById('btlResultTitle');
    var sub   = document.getElementById('btlResultSub');
    [emoji, title, sub].forEach(function(el) {
      if (el) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }
    });
    if (emoji) emoji.textContent = won ? '🏆' : '💀';
    if (title) {
      title.textContent = won ? 'VICTORY!' : 'DEFEATED';
      title.className = won ? 'win' : 'lose';
    }
    if (sub) sub.textContent = won
      ? 'You defeated all ' + BTL_WAVES + ' enemies!'
      : 'Your hero has fallen. Better luck next time!';
  }
}

/* ══════════════════════════════════════
   PUBLIC API
══════════════════════════════════════ */

/* ═══════════════════════════════════════
   HERO SELECT — TWO-PLAYER DRUM-ROLL WHEEL
═══════════════════════════════════════ */
var _hs1Idx = 0, _hs1RAF = null, _hs1Frame = 0, _hs1LastTs = 0;
var _hs2Idx = 0, _hs2RAF = null, _hs2Frame = 0, _hs2LastTs = 0;
var _hs1Locked = false, _hs2Locked = false;

var _HS_OPACITY = [0.15, 0.40, 1.00, 0.40, 0.15];
var _HS_INDENT  = [0,    14,   30,   14,   0  ];
var _HS_SIZE    = [0.25, 0.50, 1.00, 0.50, 0.25];

/* ── Continuous physics wheel ─────────────────────────────────────────────
   The drum slides as a real object with velocity + friction + spring-snap.
   Slot STYLES (opacity, size) are interpolated every frame based on each
   slot's continuous distance from centre — no discrete jumps ever happen.
   Content (text) updates only when the index crosses a slot boundary, but
   at that exact moment the pos also wraps by ±slotH so there is zero visual
   discontinuity.
─────────────────────────────────────────────────────────────────────────── */
var _hsWheelPos  = [0, 0];      /* drum translateY in px, per player */
var _hsWheelVel  = [0, 0];      /* px / frame velocity */
var _hsWheelRAF  = [0, 0];      /* rAF handles for physics loop */
var _hsWheelDrag = [false, false];
var _hsWheelDragLastY = [0, 0];
var _hsWheelDragVel   = [0, 0]; /* EMA velocity captured during drag */

/* Cached slot heights — measured once per open, updated on resize */
var _hsSlotH = [0, 0];
function _hsGetSlotH(player) {
  /* Use cached value if available (avoids forced layout reflow every RAF frame) */
  var i = player - 1;
  if (_hsSlotH[i] > 0) return _hsSlotH[i];
  var drum = document.getElementById(player === 1 ? 'hsDrum1' : 'hsDrum2');
  var h = drum ? (drum.parentElement.offsetHeight / 5) : 80;
  if (h > 0) _hsSlotH[i] = h;
  return h || 80;
}

/* Compute interpolated opacity + scale for a given abs-distance-from-center */
function _hsStyleForDist(absDist) {
  var o, s;
  if (absDist >= 2)      { o = 0.15; s = 0.25; }
  else if (absDist >= 1) { var t = absDist - 1;
                           o = 0.15 * t + 0.40 * (1 - t);
                           s = 0.25 * t + 0.50 * (1 - t); }
  else                   { var t = absDist;
                           o = 0.40 * t + 1.00 * (1 - t);
                           s = 0.50 * t + 1.00 * (1 - t); }
  return { o: o, s: s };
}

/* Called every physics frame — updates text content + interpolated styles */
function _hsRenderContinuous(player) {
  var list    = player === 1 ? BATTLE_HEROES : BATTLE_ENEMIES;
  var n       = list.length;
  var baseIdx = player === 1 ? _hs1Idx : _hs2Idx;
  var slotH   = _hsGetSlotH(player);
  var frac    = slotH > 0 ? (_hsWheelPos[player - 1] / slotH) : 0;
  var prefix  = 'hs' + player + 'Slot';

  for (var i = 0; i < 5; i++) {
    var slot = document.getElementById(prefix + i);
    if (!slot) continue;

    /* Text content — only write when it changes */
    var li   = ((baseIdx + (i - 2)) % n + n) % n;
    var name = BATTLE_NAMES[list[li]] || list[li];
    if (slot.textContent !== name) slot.textContent = name;

    /* Continuous distance from centre in slot units */
    var dist    = (i + frac) - 2;  /* signed */
    var absDist = Math.abs(dist);
    var st      = _hsStyleForDist(Math.min(absDist, 2));

    slot.style.opacity    = st.o;
    slot.style.fontSize   = (st.s * 1.8) + 'rem';
    slot.style.color      = (absDist < 0.4) ? 'var(--secondary)' : 'var(--primary)';
    slot.style.fontWeight = (absDist < 0.4) ? '900' : '700';

    /* Indent tier — nearest discrete level */
    var tier   = Math.max(0, Math.min(4, Math.round(dist + 2)));
    var indent = _HS_INDENT[tier];
    if (player === 2) {
      slot.style.paddingRight   = indent + 'px';
      slot.style.paddingLeft    = '0px';
      slot.style.justifyContent = 'flex-end';
    } else {
      slot.style.paddingLeft    = indent + 'px';
      slot.style.paddingRight   = '0px';
      slot.style.justifyContent = 'flex-start';
    }
  }
}

/* Thin wrapper kept for init-time onclick setup */
function _hsRender(player) { _hsRenderContinuous(player); }

/* Physics loop — runs via rAF, handles both drag-follow and free-spin */
function _hsPhysicsTick(player) {
  var i          = player - 1;
  var slotH      = _hsGetSlotH(player);
  var pos        = _hsWheelPos[i];
  var vel        = _hsWheelVel[i];
  var isDragging = _hsWheelDrag[i];

  if (!isDragging) {
    vel *= 0.88;                    /* friction */
    if (Math.abs(vel) < 1.0) {
      vel = 0;
      /* Snap to nearest slot: spring toward ±slotH if past halfway,
         otherwise spring back to 0.  The boundary-crossing while-loops
         below will then commit the index and reset pos to 0.
         IMPORTANT: when within 2px of the target, force-snap exactly there
         so the boundary wrap fires and the loop can settle. Without this
         the spring approaches ±slotH asymptotically and NEVER crosses it,
         causing the RAF loop to spin forever and freeze the device. */
      var snapTarget = (pos < -(slotH * 0.5)) ? -slotH
                     : (pos >  (slotH * 0.5)) ?  slotH
                     : 0;
      var delta = snapTarget - pos;
      if (Math.abs(delta) < 2) {
        pos = snapTarget;           /* force snap — triggers boundary wrap */
      } else {
        pos += delta * 0.28;
      }
    }
    pos += vel;
  }
  /* During drag: pos is set directly by pointermove; vel stays at 0 here */

  /* Wrap when crossing a full slot boundary — adjust index, keep pos in range */
  var list    = player === 1 ? BATTLE_HEROES : BATTLE_ENEMIES;
  var n       = list.length;
  var idxBefore = player === 1 ? _hs1Idx : _hs2Idx;
  while (pos <= -slotH) {
    pos += slotH;
    /* drum moved up → next item comes to centre */
    if (player === 1) _hs1Idx = (_hs1Idx + 1) % n;
    else              _hs2Idx = (_hs2Idx + 1) % n;
  }
  while (pos >= slotH) {
    pos -= slotH;
    /* drum moved down → prev item comes to centre */
    if (player === 1) _hs1Idx = ((_hs1Idx - 1 + n) % n);
    else              _hs2Idx = ((_hs2Idx - 1 + n) % n);
  }
  var idxAfter = player === 1 ? _hs1Idx : _hs2Idx;

  _hsWheelPos[i] = pos;
  _hsWheelVel[i] = vel;

  /* Move drum + update interpolated slot styles */
  var drum = document.getElementById(player === 1 ? 'hsDrum1' : 'hsDrum2');
  if (drum) {
    drum.style.transition = 'none';
    drum.style.transform  = 'translateY(' + pos + 'px)';
  }
  _hsRenderContinuous(player);

  /* Whenever the centre item changes, schedule a preview refresh.
     The debounce (150 ms) coalesces rapid changes during fast spins. */
  if (idxAfter !== idxBefore) _hsDebouncedPreview(player);

  /* Settle: stop loop and update preview immediately once wheel is at rest */
  if (!isDragging && Math.abs(pos) < 0.4 && Math.abs(vel) < 0.15) {
    _hsWheelPos[i] = 0;
    _hsWheelVel[i] = 0;
    if (drum) drum.style.transform = 'translateY(0)';
    _hsRenderContinuous(player);
    clearTimeout(_hsPreviewDTimer[i]);   /* cancel debounce — settle fires immediately */
    _hsPreviewDTimer[i] = null;
    _hsStartPreview(player);
    _hsWheelRAF[i] = 0;
    return;                         /* exit loop */
  }

  _hsWheelRAF[i] = requestAnimationFrame(function() { _hsPhysicsTick(player); });
}

/* Debounced preview — fires 150 ms after the last index change.
   Prevents hammering _hsStartPreview during fast spins while still
   updating the preview promptly once the finger slows or stops. */
var _hsPreviewDTimer = [null, null];
function _hsDebouncedPreview(player) {
  var i = player - 1;
  clearTimeout(_hsPreviewDTimer[i]);
  _hsPreviewDTimer[i] = setTimeout(function() {
    _hsPreviewDTimer[i] = null;
    _hsStartPreview(player);
  }, 150);
}

/* Kick physics loop if not already running */
function _hsKickPhysics(player) {
  var i = player - 1;
  if (!_hsWheelRAF[i]) {
    _hsWheelRAF[i] = requestAnimationFrame(function() { _hsPhysicsTick(player); });
  }
}

/* Public: add a velocity impulse (mouse-wheel events, arrow buttons) */
function _hsScroll(player, dir) {
  if (player === 1 && _hs1Locked) return;
  if (player === 2 && _hs2Locked) return;
  /* dir = 1 → next item → drum moves up → negative velocity */
  var slotH = _hsGetSlotH(player);
  _hsWheelVel[player - 1] -= dir * slotH * 0.22;
  _hsKickPhysics(player);
}

function _hsUpdateLockUI() {
  var l1  = document.getElementById('hsLock1');
  var l2  = document.getElementById('hsLock2');
  var btn = document.getElementById('hsConfirm');
  var w1  = document.getElementById('hsWheel1');
  var w2  = document.getElementById('hsWheel2');
  if (l1) {
    l1.textContent = _hs1Locked ? '✔ LOCKED IN' : '🔒 LOCK IN';
    l1.classList.toggle('locked', _hs1Locked);
  }
  if (l2) {
    l2.textContent = _hs2Locked ? '✔ LOCKED IN' : '🔒 LOCK IN';
    l2.classList.toggle('locked', _hs2Locked);
  }
  if (w1) w1.classList.toggle('locked-in', _hs1Locked);
  if (w2) w2.classList.toggle('locked-in', _hs2Locked);
  if (btn) btn.classList.toggle('active', _hs1Locked && _hs2Locked);
}

function _hsLock(player) {
  if (player === 1) _hs1Locked = !_hs1Locked;
  else              _hs2Locked = !_hs2Locked;
  _hsUpdateLockUI();
}

/* FIX: use _hsLastTs = ts (not += spf) to prevent speed runaway on missed frames */
function _hsStartPreview(player) {
  if (player === 1) {
    if (_hs1RAF) { cancelAnimationFrame(_hs1RAF); _hs1RAF = null; }
    _hs1Frame = 0; _hs1LastTs = 0;
  } else {
    if (_hs2RAF) { cancelAnimationFrame(_hs2RAF); _hs2RAF = null; }
    _hs2Frame = 0; _hs2LastTs = 0;
  }

  var list = player === 1 ? BATTLE_HEROES : BATTLE_ENEMIES;
  var idx  = player === 1 ? _hs1Idx : _hs2Idx;
  var key  = list[idx];
  var def  = BATTLE_CHARS[key];
  if (!def) return;

  var cid    = player === 1 ? 'hsPreview1' : 'hsPreview2';
  var canvas = document.getElementById(cid);
  if (!canvas) return;
  var rect   = canvas.getBoundingClientRect();
  canvas.width  = Math.round(rect.width)  || 280;
  canvas.height = Math.round(rect.height) || 420;

  var anim = def.attack || def.idle;
  if (!anim) return;

  var capKey = key, capP = player;
  _btlLoadImg(key, function(img) {
    if (!img) return;
    var curList = capP === 1 ? BATTLE_HEROES : BATTLE_ENEMIES;
    var curIdx  = capP === 1 ? _hs1Idx : _hs2Idx;
    if (curList[curIdx] !== capKey) return;

    function loop(ts) {
      var cl = capP === 1 ? BATTLE_HEROES : BATTLE_ENEMIES;
      var ci = capP === 1 ? _hs1Idx : _hs2Idx;
      if (cl[ci] !== capKey) return;
      var c = document.getElementById(cid);
      if (!c) return;

      /* timing — reset to ts on each advance, no runaway */
      var spf = 1000 / (anim.fps || 10);
      if (capP === 1) {
        if (!_hs1LastTs) _hs1LastTs = ts;
        if (ts - _hs1LastTs >= spf) { _hs1Frame = (_hs1Frame + 1) % anim.n; _hs1LastTs = ts; }
      } else {
        if (!_hs2LastTs) _hs2LastTs = ts;
        if (ts - _hs2LastTs >= spf) { _hs2Frame = (_hs2Frame + 1) % anim.n; _hs2LastTs = ts; }
      }

      var frame = capP === 1 ? _hs1Frame : _hs2Frame;
      var ctx   = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      var fw = anim.fw, fh = anim.fh;
      var sc = Math.min(c.width / fw, c.height / fh) * 0.82;
      var dw = fw * sc, dh = fh * sc;
      var dx = (c.width  - dw) / 2;
      var dy = c.height - dh;        /* bottom-anchor in preview canvas */

      if (capP === 2) {
        /* flip P2 so monster faces left toward the hero */
        ctx.save();
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(img, anim.sx + frame * fw, anim.sy, fw, fh, dx, dy, dw, dh);
      if (capP === 2) ctx.restore();

      if (capP === 1) { _hs1RAF = requestAnimationFrame(loop); }
      else            { _hs2RAF = requestAnimationFrame(loop); }
    }
    if (capP === 1) { _hs1RAF = requestAnimationFrame(loop); }
    else            { _hs2RAF = requestAnimationFrame(loop); }
  });
}

function _hsConfirm() {
  if (_hs1RAF) { cancelAnimationFrame(_hs1RAF); _hs1RAF = null; }
  if (_hs2RAF) { cancelAnimationFrame(_hs2RAF); _hs2RAF = null; }
  btlStartBattle(BATTLE_HEROES[_hs1Idx], BATTLE_ENEMIES[_hs2Idx]);
}

function _hsInitWheel(player, wheelId) {
  var wheel = document.getElementById(wheelId);
  if (!wheel) return;

  /* ── mouse / trackpad wheel ── */
  wheel.addEventListener('wheel', function(e) {
    e.preventDefault();
    if (player === 1 && _hs1Locked) return;
    if (player === 2 && _hs2Locked) return;
    var slotH = _hsGetSlotH(player);
    _hsWheelVel[player - 1] -= (e.deltaY > 0 ? 1 : -1) * slotH * 0.22;
    _hsKickPhysics(player);
  }, { passive: false });

  /* ── pointer drag — finger / stylus / mouse on flat panel ── */
  wheel.addEventListener('pointerdown', function(e) {
    if (player === 1 && _hs1Locked) return;
    if (player === 2 && _hs2Locked) return;
    var i = player - 1;
    _hsWheelDrag[i]      = true;
    _hsWheelDragLastY[i] = e.clientY;
    _hsWheelDragVel[i]   = 0;
    _hsWheelVel[i]       = 0;        /* cancel any free-spin */
    wheel.setPointerCapture(e.pointerId);
    e.preventDefault();
    _hsKickPhysics(player);          /* ensure loop is running */
  });

  wheel.addEventListener('pointermove', function(e) {
    var i = player - 1;
    if (!_hsWheelDrag[i]) return;
    var dy = e.clientY - _hsWheelDragLastY[i];
    _hsWheelDragLastY[i] = e.clientY;
    /* Rolling EMA velocity for inertia on release */
    _hsWheelDragVel[i] = dy * 0.55 + _hsWheelDragVel[i] * 0.45;
    /* Direct position follow — physics loop will apply boundary wrap + render */
    _hsWheelPos[i] += dy;
    e.preventDefault();
  });

  function _endDrag() {
    var i = player - 1;
    if (!_hsWheelDrag[i]) return;
    _hsWheelDrag[i] = false;
    /* Hand off captured drag velocity to physics for inertial coast */
    _hsWheelVel[i] = _hsWheelDragVel[i];
  }
  wheel.addEventListener('pointerup',     _endDrag);
  wheel.addEventListener('pointercancel', _endDrag);
}

function _hsInit() {
  _hs1Idx = 0; _hs1Frame = 0; _hs1LastTs = 0;
  _hs2Idx = 0; _hs2Frame = 0; _hs2LastTs = 0;
  _hs1Locked = false; _hs2Locked = false;

  /* Reset physics state */
  if (_hsWheelRAF[0]) { cancelAnimationFrame(_hsWheelRAF[0]); _hsWheelRAF[0] = 0; }
  if (_hsWheelRAF[1]) { cancelAnimationFrame(_hsWheelRAF[1]); _hsWheelRAF[1] = 0; }
  clearTimeout(_hsPreviewDTimer[0]); clearTimeout(_hsPreviewDTimer[1]);
  _hsWheelPos     = [0, 0];
  _hsWheelVel     = [0, 0];
  _hsWheelDrag    = [false, false];
  _hsWheelDragVel = [0, 0];
  _hsPreviewDTimer = [null, null];
  _hsSlotH        = [0, 0];       /* re-measure on next frame */

  /* Set onclick handlers once (slot i → scroll by i-2) */
  [1, 2].forEach(function(p) {
    for (var si = 0; si < 5; si++) {
      (function(pp, offset) {
        var slot = document.getElementById('hs' + pp + 'Slot' + si);
        if (slot) slot.onclick = function() { if (offset !== 0) _hsScroll(pp, offset); };
      })(p, si - 2);
    }
  });

  _hsRenderContinuous(1);
  _hsRenderContinuous(2);
  _hsUpdateLockUI();
  _hsStartPreview(1);
  _hsStartPreview(2);
  _hsInitWheel(1, 'hsWheel1');
  _hsInitWheel(2, 'hsWheel2');
}

/* ══════════════════════════════════════════════════════════════════
   MODE / LEVEL SELECT
══════════════════════════════════════════════════════════════════ */
var _wbMode         = 'hanzi';
var _wbLevel        = 'L1';
var _wbMHUnits      = [];   // selected MH unit keys e.g. ['MH1U3','MH2U5']
var _wbTimeLimitSec = 180;  // chosen game duration (30–180 s)

function _msSetMode(mode) {
  _wbMode = mode;
  var hBtn = document.getElementById('msHanziBtn');
  var pBtn = document.getElementById('msPinyinBtn');
  if (hBtn) hBtn.classList.toggle('active', mode === 'hanzi');
  if (pBtn) pBtn.classList.toggle('active', mode === 'pinyin');
}

function _msSetLevel(level) {
  GameAudio.playClick();
  _wbLevel = level;
  /* Switching to a TOCFL level — clear any MH unit selection */
  _wbMHUnits = [];
  document.querySelectorAll('.mh-unit-btn').forEach(function(b) { b.classList.remove('active'); });
  var badge = document.getElementById('mhWbBadge');
  if (badge) badge.textContent = '';
  document.querySelectorAll('.ms-level-btn:not(.mh-unit-btn)').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.level === level);
  });
}

function _msUpdateTimer(val) {
  _wbTimeLimitSec = parseInt(val, 10);
  var m = Math.floor(_wbTimeLimitSec / 60);
  var s = _wbTimeLimitSec % 60;
  var display = document.getElementById('msTimerDisplay');
  if (display) display.textContent = m + ':' + (s < 10 ? '0' : '') + s;
  /* Update slider fill track */
  var slider = document.getElementById('msTimerSlider');
  if (slider) {
    var pct = ((_wbTimeLimitSec - 30) / (180 - 30) * 100).toFixed(1) + '%';
    slider.style.setProperty('--slider-pct', pct);
  }
}

function _mhWbToggle(unitKey, btn) {
  GameAudio.playClick();
  var idx = _wbMHUnits.indexOf(unitKey);
  if (idx === -1) { _wbMHUnits.push(unitKey); btn.classList.add('active'); }
  else            { _wbMHUnits.splice(idx, 1); btn.classList.remove('active'); }
  var badge = document.getElementById('mhWbBadge');
  if (badge) badge.textContent = _wbMHUnits.length ? '(' + _wbMHUnits.length + ' unit' + (_wbMHUnits.length > 1 ? 's' : '') + ' selected)' : '';
  if (_wbMHUnits.length > 0) {
    _wbLevel = 'MH_MULTI';
    /* Deactivate TOCFL level buttons */
    document.querySelectorAll('.ms-level-btn:not(.mh-unit-btn)').forEach(function(b) { b.classList.remove('active'); });
  } else {
    /* No MH units selected — revert to L1 */
    _wbLevel = 'L1';
    document.querySelectorAll('.ms-level-btn[data-level="L1"]:not(.mh-unit-btn)').forEach(function(b) { b.classList.add('active'); });
  }
}

var _customActivity = null;
var _customWordDb = [];

function _initCustomQuestions(activity) {
  _customActivity = activity;
  _customWordDb = [];
  if (activity && Array.isArray(activity.questions) && activity.questions.length > 0) {
    activity.questions.forEach(function(q) {
      var correctOpt = (q.options && Array.isArray(q.options)) ? q.options.find(function(o){ return o.isCorrect; }) : null;
      var ansText = correctOpt ? correctOpt.text : (q.text || '');
      var promptText = q.text || '';
      
      var tokens = [];
      if (/[\u4e00-\u9fa5]/.test(ansText)) {
        tokens = ansText.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '').split('');
      } else {
        tokens = ansText.split(/\s+/).map(function(w){ return w.replace(/[^\w]/g, ''); }).filter(Boolean);
      }
      
      if (tokens.length > 0) {
        _customWordDb.push({
          word: tokens.join(''),
          tokens: tokens,
          prompt: promptText,
          pinyin: q.category || ''
        });
      }
      
      if (q.options && Array.isArray(q.options)) {
        q.options.filter(function(o){ return !o.isCorrect; }).forEach(function(wo) {
          var wTokens = /[\u4e00-\u9fa5]/.test(wo.text)
            ? wo.text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '').split('')
            : wo.text.split(/\s+/).map(function(w){ return w.replace(/[^\w]/g, ''); }).filter(Boolean);
          if (wTokens.length > 0) {
            _customWordDb.push({
              word: wTokens.join(''),
              tokens: wTokens,
              prompt: '',
              pinyin: ''
            });
          }
        });
      }
    });
  }
}

/* Return the merged vocab array for the current WB level */
function _wbGetDB() {
  if (Array.isArray(_customWordDb) && _customWordDb.length > 0) {
    return _customWordDb.map(function(item) {
      return [item.word, item.pinyin || ''];
    });
  }
  if (_wbLevel === 'MH_MULTI') {
    return _wbMHUnits.reduce(function(acc, k) { return acc.concat(VOCAB_DB[k] || []); }, []);
  }
  return VOCAB_DB[_wbLevel] || [];
}

function _msConfirm() {
  GameAudio.playClick();
  document.getElementById('btlModeSelect').style.display = 'none';
  document.getElementById('btlHeroSelect').style.display = 'block';
  _hsInit();
}

/* ══════════════════════════════════════════════════════════════════
   WORD BUILDER — TWO-PLAYER GAME
══════════════════════════════════════════════════════════════════ */

/* ── State ── */
var _wbSt = {
  1: { score: 0, tiles: [], selectedIdx: [] },
  2: { score: 0, tiles: [], selectedIdx: [] }
};
var _wbAvatarRAF    = [null, null];
var _wbAvatarKey    = [null, null];
var _wbAvatarState  = ['idle', 'idle'];   /* 'idle' | 'hurt' | 'dead' */
var _wbAttacking    = [false, false];
var _wbAttackTimer  = [null, null];
var _wbPendingRefill= [null, null];
var _wbWordSet      = null;
var _wbPrefixSet    = null;
var _wbTimerSec     = 180;
var _wbTimerInterval= null;
var _wbGameOver     = false;

/* ── Utilities ── */
function _wbShuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function _wbPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function _wbPinyinLetters(pinyin) {
  var out = [], s = pinyin.trim();
  for (var k = 0; k < s.length; ) {
    var cp = s.codePointAt(k);
    out.push(String.fromCodePoint(cp));
    k += cp > 0xFFFF ? 2 : 1;
  }
  return out;
}

/* ── Word / prefix sets ── */
function _wbBuildWordSets() {
  var db = (_wbGetDB());
  _wbWordSet   = {};
  _wbPrefixSet = {};
  db.forEach(function(w) {
    var chars = _wbMode === 'hanzi' ? w[0].split('') : _wbPinyinLetters(w[1]);
    if (chars.length < 1) return;   /* allow single-char vocab */
    var str = chars.join('');
    _wbWordSet[str] = true;
    for (var j = 1; j <= chars.length; j++)
      _wbPrefixSet[chars.slice(0, j).join('')] = true;
  });
}

/* ── Character pool ── */
function _wbDistractorPool() {
  var db = (_wbGetDB()), pool = [];
  if (_wbMode === 'hanzi') {
    db.forEach(function(w) {
      for (var k = 0; k < w[0].length; k++) {
        if (_wbValidTileChar(w[0][k])) pool.push(w[0][k]);
      }
    });
  } else {
    db.forEach(function(w) { _wbPinyinLetters(w[1]).forEach(function(l){ pool.push(l); }); });
  }
  return pool;
}

/* Returns true for valid tile characters — rejects brackets, slashes, etc. */
function _wbValidTileChar(c) {
  return /[一-鿿㐀-䶿\u{20000}-\u{2a6df}]/u.test(c);
}

/* ── Dynamic Word Selection according to lesson composition ── */
function _wbGetSelectionRatio() {
  var db = _wbGetDB();
  var singleWords = [], multiWords = [];
  
  db.forEach(function(w) {
    var clean = w[0].split('').filter(_wbValidTileChar);
    var len = _wbMode === 'hanzi' ? clean.length : _wbPinyinLetters(w[1]).length;
    if (len === 1) {
      singleWords.push(w);
    } else if (len >= 2) {
      multiWords.push(w);
    }
  });

  var total = singleWords.length + multiWords.length;
  var singlePct = total > 0 ? (singleWords.length / total) : 0;
  
  /* If single char words exceed 50% in the selected lessons, cap their appearance chance below 50% (e.g. 25%-30%).
     Otherwise, match the natural percentage of single char words. */
  var singleChance;
  if (multiWords.length === 0) {
    singleChance = 1.0;
  } else if (singleWords.length === 0) {
    singleChance = 0.0;
  } else if (singlePct > 0.50) {
    singleChance = 0.28; /* Guaranteed well below 50% */
  } else {
    singleChance = singlePct; /* Matches natural lesson percentage */
  }

  return {
    singleWords: singleWords,
    multiWords: multiWords,
    singleChance: singleChance,
    singlePct: singlePct
  };
}

/* Pick `count` characters with dynamic ratio prioritizing 2-character words */
function _wbPickChars(count) {
  var ratio = _wbGetSelectionRatio();
  var singleWords = ratio.singleWords;
  var multiWords = ratio.multiWords;
  var singleChance = ratio.singleChance;
  
  var chars = [], attempts = 0;
  
  /* Pick complete vocabulary words matching the calibrated probability */
  while (chars.length < count && attempts < 80) {
    attempts++;
    var useSingle = (Math.random() < singleChance && singleWords.length > 0) || multiWords.length === 0;
    var word = useSingle ? _wbPick(singleWords) : _wbPick(multiWords);
    if (!word) word = _wbPick(_wbGetDB());
    if (!word) break;
    
    var wc = _wbMode === 'hanzi'
      ? word[0].split('').filter(_wbValidTileChar)
      : _wbPinyinLetters(word[1]);
      
    if (wc.length > 0) {
      if (chars.length + wc.length <= count) {
        wc.forEach(function(c){ chars.push(c); });
      } else if (chars.length + 1 === count && attempts > 30) {
        chars.push(wc[0]);
      }
    }
  }

  /* Fallback pool if slots still open */
  var pool = _wbDistractorPool();
  while (chars.length < count) {
    chars.push(_wbPick(pool) || '字');
  }
  return chars;
}

/* ── Count how many valid words can be formed from current board tiles ── */
function _wbCountValidWords(player, customTiles) {
  var tiles = customTiles || (_wbSt[player] && _wbSt[player].tiles) || [];
  if (!tiles.length || !_wbWordSet) return 0;
  
  var count = 0;
  var len = tiles.length;
  
  /* 1-character words */
  for (var i = 0; i < len; i++) {
    if (_wbWordSet[tiles[i]]) count++;
  }
  
  /* 2-character words (order i -> j) */
  for (var i = 0; i < len; i++) {
    for (var j = 0; j < len; j++) {
      if (i === j) continue;
      var w2 = tiles[i] + tiles[j];
      if (_wbWordSet[w2]) count++;
    }
  }
  
  /* 3-character words (with prefix prune) */
  if (_wbPrefixSet) {
    for (var i = 0; i < len; i++) {
      for (var j = 0; j < len; j++) {
        if (i === j) continue;
        var p2 = tiles[i] + tiles[j];
        if (_wbPrefixSet[p2]) {
          for (var k = 0; k < len; k++) {
            if (k === i || k === j) continue;
            var w3 = p2 + tiles[k];
            if (_wbWordSet[w3]) count++;
          }
        }
      }
    }
  }
  
  return count;
}

/* ── Check board solvability; auto-reshuffle if no combinations are possible ── */
function _wbEnsureSolvable(player, showNotice) {
  var validCount = _wbCountValidWords(player);
  if (validCount === 0) {
    _wbAutoReshuffle(player, showNotice !== false);
    return false;
  }
  return true;
}

function _wbAutoReshuffle(player, showNotice) {
  var st = _wbSt[player];
  st.selectedIdx = [];
  
  /* Loop regeneration until at least 1 valid word combination exists */
  var attempts = 0, newTiles;
  do {
    newTiles = _wbShuffle(_wbPickChars(16));
    attempts++;
  } while (_wbCountValidWords(player, newTiles) < 1 && attempts < 50);
  
  st.tiles = newTiles;
  _wbRenderGrid(player);
  _wbRenderFloat(player);
  _wbUpdateGlow(player);
  
  /* Animate dropping on all tiles */
  var grid = document.getElementById('wbGrid' + player);
  if (grid) {
    var divs = grid.querySelectorAll('.wb-tile');
    divs.forEach(function(el) {
      el.classList.add('dropping');
      setTimeout(function(){ el.classList.remove('dropping'); }, 420);
    });
  }
  
  if (showNotice) {
    GameAudio.playClick();
    var panel = document.getElementById('wbPanel' + player);
    if (panel) {
      var badge = document.createElement('div');
      badge.className = 'wb-shuffle-badge';
      badge.innerHTML = '🔄 無可用組合，自動洗牌！<small style="opacity:0.8;font-size:0.75em;letter-spacing:1px">AUTO RESHUFFLE</small>';
      panel.appendChild(badge);
      setTimeout(function() {
        if (badge.parentElement) badge.parentElement.removeChild(badge);
      }, 1500);
    }
  }
}

/* ── Grid generation — 4×4 = 16 tiles (guaranteed solvable) ── */
function _wbFillGrid(player) {
  var st = _wbSt[player];
  st.selectedIdx = [];
  var attempts = 0, tiles;
  do {
    tiles = _wbShuffle(_wbPickChars(16));
    attempts++;
  } while (_wbCountValidWords(player, tiles) < 1 && attempts < 50);
  st.tiles = tiles;
}

/* ── Render: grid ── */
function _wbRenderGrid(player) {
  var st   = _wbSt[player];
  var grid = document.getElementById('wbGrid' + player);
  if (!grid) return;
  grid.innerHTML = '';
  var selSet = {};
  st.selectedIdx.forEach(function(i){ selSet[i] = true; });
  st.tiles.forEach(function(ch, idx) {
    var div = document.createElement('div');
    div.className   = 'wb-tile' + (selSet[idx] ? ' selected' : '');
    div.textContent = ch;
    if (!selSet[idx]) {
      (function(p, i){ div.addEventListener('pointerdown', function(e){ e.preventDefault(); _wbTileTap(p, i); }); })(player, idx);
    }
    grid.appendChild(div);
  });
}

/* ── Render: float zone ── */
function _wbRenderFloat(player) {
  var st   = _wbSt[player];
  var zone = document.getElementById('wbFloat' + player);
  if (!zone) return;
  zone.innerHTML = '';
  if (st.selectedIdx.length === 0) {
    var hint = document.createElement('span');
    hint.className   = 'wb-float-hint';
    hint.textContent = '點擊方塊組合詞語';
    zone.appendChild(hint);
    return;
  }
  st.selectedIdx.forEach(function(tileIdx, pos) {
    var btn = document.createElement('div');
    btn.className   = 'wb-float-tile';
    btn.textContent = st.tiles[tileIdx];
    (function(p, position){ btn.addEventListener('pointerdown', function(e){ e.preventDefault(); _wbFloatTap(p, position); }); })(player, pos);
    zone.appendChild(btn);
  });
}

/* ── Glow: green = valid word, red = building/invalid ── */
function _wbUpdateGlow(player) {
  var st   = _wbSt[player];
  var zone = document.getElementById('wbFloat' + player);
  var atkBtn = document.getElementById('wbAttack' + player);
  if (!zone) return;
  zone.classList.remove('glow-green', 'glow-red');
  if (st.selectedIdx.length === 0) {
    if (atkBtn) atkBtn.textContent = '⚔ ATTACK';
    return;
  }
  var str = st.selectedIdx.map(function(i){ return st.tiles[i]; }).join('');
  var isValid = _wbWordSet && !!_wbWordSet[str];
  zone.classList.add(isValid ? 'glow-green' : 'glow-red');
  
  if (atkBtn) {
    if (isValid) {
      var pts = Math.max(1, st.selectedIdx.length);
      atkBtn.textContent = '⚔ ATTACK (+' + pts + ' PTS)';
    } else {
      atkBtn.textContent = '⚔ ATTACK';
    }
  }
}

/* ── Tap grid tile ── */
function _wbTileTap(player, idx) {
  if (_wbGameOver || _wbAttacking[player - 1]) return;
  GameAudio.playClick();
  var st = _wbSt[player];
  if (st.selectedIdx.indexOf(idx) >= 0) return;   /* already selected */
  st.selectedIdx.push(idx);
  _wbRenderGrid(player);
  _wbRenderFloat(player);
  _wbUpdateGlow(player);
}

/* ── Tap float tile at position pos → return tiles [pos..end] to grid ── */
function _wbFloatTap(player, pos) {
  if (_wbGameOver) return;
  GameAudio.playClick();
  _wbSt[player].selectedIdx = _wbSt[player].selectedIdx.slice(0, pos);
  _wbRenderGrid(player);
  _wbRenderFloat(player);
  _wbUpdateGlow(player);
}

/* ── Attack button pressed ── */
function _wbAttackPressed(player) {
  if (_wbGameOver || _wbAttacking[player - 1]) return;
  GameAudio.playClick();
  var st  = _wbSt[player];
  if (st.selectedIdx.length === 0) return;
  var str = st.selectedIdx.map(function(i){ return st.tiles[i]; }).join('');
  if (_wbWordSet && _wbWordSet[str]) {
    var used = st.selectedIdx.slice();
    st.selectedIdx = [];
    _wbRenderGrid(player);
    _wbRenderFloat(player);
    _wbUpdateGlow(player);
    _wbWordFound(player, used);
  } else {
    /* Shake float zone */
    GameAudio.playFailure();
    var zone = document.getElementById('wbFloat' + player);
    if (zone) {
      zone.classList.remove('wb-shake');
      void zone.offsetWidth;
      zone.classList.add('wb-shake');
      setTimeout(function(){ zone.classList.remove('wb-shake'); }, 400);
    }
  }
}

/* ── Refill specific tile slots (with drop animation & auto-solvable check) ── */
function _wbRefillTiles(player, usedIndices) {
  var st   = _wbSt[player];
  var fill = _wbPickChars(usedIndices.length);
  usedIndices.forEach(function(idx, j){ st.tiles[idx] = fill[j]; });
  _wbRenderGrid(player);
  var grid = document.getElementById('wbGrid' + player);
  if (grid) {
    var divs = grid.querySelectorAll('.wb-tile');
    usedIndices.forEach(function(idx) {
      if (divs[idx]) {
        divs[idx].classList.add('dropping');
        (function(el){ setTimeout(function(){ el.classList.remove('dropping'); }, 420); })(divs[idx]);
      }
    });
  }
  _wbRenderFloat(player);
  _wbUpdateGlow(player);

  /* Verify board remains solvable; auto-reshuffle if no valid words can be formed */
  setTimeout(function() {
    _wbEnsureSolvable(player, true);
  }, 450);
}

/* ── Score & attack sequencing: 2-char = 2 pts, 3-char = 3 pts, N-char = N pts ── */
function _wbWordFound(player, usedIndices) {
  var wordLength = usedIndices.length;
  var pointsEarned = Math.max(1, wordLength); // 2-char = 2 points, 3-char = 3 points
  
  GameAudio.playSuccess(pointsEarned);
  var i = player - 1, otherP = player === 1 ? 2 : 1, otherI = 1 - i;
  _wbSt[player].score += pointsEarned;
  _wbPendingRefill[i] = usedIndices;

  /* Score bar update */
  var s1 = document.getElementById('wbScore1'), s2 = document.getElementById('wbScore2');
  if (s1) s1.textContent = _wbSt[1].score;
  if (s2) s2.textContent = _wbSt[2].score;

  /* Floating +N PTS popup */
  _wbSpawnScorePopup(player, pointsEarned);

  /* Flash grid (hurt fires later — timed inside _wbRunAttack) */
  var grid = document.getElementById('wbGrid' + player);
  if (grid) { grid.classList.add('wb-success'); setTimeout(function(){ grid.classList.remove('wb-success'); }, 520); }

  /* 100 ms simultaneous window */
  if (_wbAttackTimer[i]) clearTimeout(_wbAttackTimer[i]);
  _wbAttackTimer[i] = setTimeout(function() {
    _wbAttackTimer[i] = null;
    if (_wbAttacking[i]) return;
    var simul = (_wbAttackTimer[otherI] !== null);
    _wbAttacking[i] = true;
    var capI = i, capP = player, capOI = otherI, capOP = otherP;

    if (simul && !_wbAttacking[capOI]) {
      /* ── Both pressed within 100 ms: clash animation ── */
      clearTimeout(_wbAttackTimer[capOI]);
      _wbAttackTimer[capOI] = null;
      _wbAttacking[capOI] = true;
      /* Run both in parallel; each fires its own onDone */
      _wbRunAttackClash(capP,  capOP, function() {
        _wbAttacking[capI] = false;
        if (_wbPendingRefill[capI]) { _wbRefillTiles(capP, _wbPendingRefill[capI]); _wbPendingRefill[capI] = null; }
      });
      _wbRunAttackClash(capOP, capP, function() {
        _wbAttacking[capOI] = false;
        if (_wbPendingRefill[capOI]) { _wbRefillTiles(capOP, _wbPendingRefill[capOI]); _wbPendingRefill[capOI] = null; }
      });
    } else {
      /* ── Solo attack ── */
      _wbRunAttack(capP, capOP, function() {
        _wbAttacking[capI] = false;
        if (_wbPendingRefill[capI]) { _wbRefillTiles(capP, _wbPendingRefill[capI]); _wbPendingRefill[capI] = null; }
      });
    }
  }, 100);
}

function _wbSpawnScorePopup(player, pts) {
  var scoreEl = document.getElementById('wbScore' + player);
  if (!scoreEl) return;
  var pop = document.createElement('div');
  pop.className = 'wb-pts-popup';
  pop.textContent = '+' + pts;
  scoreEl.parentElement.appendChild(pop);
  if (player === 1) {
    pop.style.left = '60px';
  } else {
    pop.style.right = '60px';
  }
  pop.style.top = '10px';
  setTimeout(function() {
    if (pop.parentElement) pop.parentElement.removeChild(pop);
  }, 850);
}

/* ── Solo attack: run in, strike, slide back ── */
function _wbRunAttack(player, otherPlayer, onDone) {
  var i    = player - 1;
  var wrap = document.getElementById(player === 1 ? 'wbHeroWrap' : 'wbEnemyWrap');
  if (!wrap) { onDone && onDone(); return; }
  var scene = document.getElementById('wbScene');
  var tx    = (player === 1 ? 1 : -1) * (scene ? scene.offsetWidth : 320) * 0.50;

  /* Calculate how many ms = 1 frame for this attacker, to time the hit 2 frames early */
  var attackerDef = BATTLE_CHARS[_wbAvatarKey[i]];
  var atkN        = (attackerDef && attackerDef.attack && attackerDef.attack.n) || 5;
  var frameDur    = Math.round(1500 / atkN);          /* ms per attack frame */
  var hitAt       = 1500 - 2 * frameDur;              /* fire hurt 2 frames before end */

  if (_wbAvatarState[i] !== 'dead') _wbAvatarState[i] = 'run';
  wrap.style.transition = 'transform 0.42s cubic-bezier(0.4,0,0.6,1)';
  wrap.style.transform  = 'translateX(' + tx + 'px)';

  setTimeout(function() {
    if (_wbAvatarState[i] !== 'dead') _wbAvatarState[i] = 'attack';

    /* Trigger hurt on opponent 2 frames before attack finishes */
    setTimeout(function() { _wbPlayHurt(otherPlayer); }, hitAt);

    setTimeout(function() {
      if (_wbAvatarState[i] !== 'dead') _wbAvatarState[i] = 'idle';
      wrap.style.transition = 'transform 0.38s ease-out';
      wrap.style.transform  = 'translateX(0)';
      setTimeout(function() { wrap.style.transition = ''; onDone && onDone(); }, 380);
    }, 1500);   /* hold attack for full 1.5 s */
  }, 420);
}

/* ── Clash: both run until 1 col apart, hold attack 2 s, blink back ── */
function _wbRunAttackClash(player, otherPlayer, onDone) {
  var i    = player - 1;
  var wrap = document.getElementById(player === 1 ? 'wbHeroWrap' : 'wbEnemyWrap');
  if (!wrap) { onDone && onDone(); return; }
  var scene = document.getElementById('wbScene');
  var sw    = scene ? scene.offsetWidth : 320;
  /* Each character travels ~42% of scene width — stops with ~1 col gap between them */
  var tx = (player === 1 ? 1 : -1) * sw * 0.42;

  /* Time the hit 2 frames before the 2000ms clash attack ends */
  var attackerDef = BATTLE_CHARS[_wbAvatarKey[i]];
  var atkN        = (attackerDef && attackerDef.attack && attackerDef.attack.n) || 5;
  var frameDur    = Math.round(2000 / atkN);
  var hitAt       = 2000 - 2 * frameDur;

  /* Run phase */
  if (_wbAvatarState[i] !== 'dead') _wbAvatarState[i] = 'run';
  wrap.style.transition = 'transform 0.36s cubic-bezier(0.4,0,0.6,1)';
  wrap.style.transform  = 'translateX(' + tx + 'px)';

  setTimeout(function() {
    wrap.style.transition = 'none';
    if (_wbAvatarState[i] !== 'dead') _wbAvatarState[i] = 'attack';

    /* Trigger hurt on opponent 2 frames before clash ends */
    setTimeout(function() { _wbPlayHurt(otherPlayer); }, hitAt);

    setTimeout(function() {
      if (_wbAvatarState[i] !== 'dead') _wbAvatarState[i] = 'idle';
      wrap.style.transition = 'none';
      wrap.style.transform  = 'translateX(0)';
      setTimeout(function() { wrap.style.transition = ''; onDone && onDone(); }, 50);
    }, 2000);
  }, 360);
}

/* ── Avatar animation (idle / hurt / dead state machine) ── */
function _wbStartAvatar(player, charKey) {
  var i = player - 1;
  if (_wbAvatarRAF[i]) { cancelAnimationFrame(_wbAvatarRAF[i]); _wbAvatarRAF[i] = null; }
  _wbAvatarKey[i]   = charKey;
  _wbAvatarState[i] = 'idle';
  var def = BATTLE_CHARS[charKey];
  if (!def) return;
  _btlLoadImg(charKey, function(img) {
    if (!img) return;
    var canvasId = player === 1 ? 'wbHeroCanvas' : 'wbEnemyCanvas';
    var canvas   = document.getElementById(canvasId);
    if (!canvas) return;
    /* Size canvas from the scene element — avoids CSS % chain issues on Android */
    var sceneEl  = document.getElementById('wbScene');
    var sceneR   = sceneEl ? sceneEl.getBoundingClientRect() : {width: 320, height: 280};
    canvas.width  = Math.round(sceneR.width  * 0.46) || 160;
    canvas.height = Math.round(sceneR.height * 0.86) || 220;
    var capI = i, capP = player;
    var curKey = '', frame = 0, lastTs = 0;
    function loop(ts) {
      var want    = _wbAvatarState[capI];
      var animDef = def[want] || def.idle || def.attack;
      if (!animDef) { _wbAvatarRAF[capI] = requestAnimationFrame(loop); return; }
      /* Reset on animation switch */
      if (want !== curKey) { curKey = want; frame = 0; lastTs = ts; }
      /* Attack: spread all frames evenly over 1500 ms; other states use sprite fps */
      var spf = (want === 'attack') ? Math.round(1500 / (animDef.n || 1)) : (1000 / (animDef.fps || 8));
      if (!lastTs) lastTs = ts;
      if (ts - lastTs >= spf) {
        frame++;
        lastTs = ts;
        if (animDef.loop === false && frame >= animDef.n) {
          /* Dead: draw last frame, stop loop */
          frame = animDef.n - 1;
          var ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          var sc = Math.min(canvas.width / animDef.fw, canvas.height / animDef.fh) * 0.95;
          var dw = animDef.fw * sc, dh = animDef.fh * sc;
          var dx = (canvas.width - dw) / 2, dy = canvas.height - dh;
          if (capP === 2) { ctx.save(); ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
          ctx.drawImage(img, animDef.sx + frame * animDef.fw, animDef.sy, animDef.fw, animDef.fh, dx, dy, dw, dh);
          if (capP === 2) ctx.restore();
          _wbAvatarRAF[capI] = null; return;
        }
        frame = frame % animDef.n;
      }
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var sc = Math.min(canvas.width / animDef.fw, canvas.height / animDef.fh) * 0.95;
      var dw = animDef.fw * sc, dh = animDef.fh * sc;
      var dx = (canvas.width - dw) / 2, dy = canvas.height - dh;
      if (capP === 2) { ctx.save(); ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
      ctx.drawImage(img, animDef.sx + frame * animDef.fw, animDef.sy, animDef.fw, animDef.fh, dx, dy, dw, dh);
      if (capP === 2) ctx.restore();
      _wbAvatarRAF[capI] = requestAnimationFrame(loop);
    }
    _wbAvatarRAF[i] = requestAnimationFrame(loop);
  });
}

/* Brief hurt flash — clears to idle after 600 ms */
function _wbPlayHurt(player) {
  GameAudio.playHit();
  var i = player - 1;
  if (_wbAvatarState[i] === 'dead') return;
  _wbAvatarState[i] = 'hurt';
  setTimeout(function(){ if (_wbAvatarState[i] === 'hurt') _wbAvatarState[i] = 'idle'; }, 600);
}

/* Switch to dead animation (plays once, holds last frame) */
function _wbPlayDead(player) { _wbAvatarState[player - 1] = 'dead'; }

/* ── Countdown timer ── */
function _wbStartTimer() {
  _wbTimerSec = _wbTimeLimitSec;   // use the chosen duration
  if (_wbTimerInterval) clearInterval(_wbTimerInterval);
  var timerEl = document.getElementById('wbTimer');
  if (timerEl) { timerEl.textContent = '3:00'; timerEl.classList.remove('warning'); }
  _wbTimerInterval = setInterval(function() {
    _wbTimerSec--;
    var m = Math.floor(_wbTimerSec / 60), s = _wbTimerSec % 60;
    var el = document.getElementById('wbTimer');
    if (el) {
      el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
      if (_wbTimerSec <= 30) el.classList.add('warning');
    }
    if (_wbTimerSec <= 0) { clearInterval(_wbTimerInterval); _wbTimerInterval = null; _wbEndGame(); }
  }, 1000);
}

/* ── End game ── */
function _wbEndGame() {
  if (_wbGameOver) return;
  _wbGameOver = true;
  GameAudio.stopBGM();
  GameAudio.playVictory();
  if (_wbTimerInterval)  { clearInterval(_wbTimerInterval);  _wbTimerInterval  = null; }
  if (_wbAttackTimer[0]) { clearTimeout(_wbAttackTimer[0]);  _wbAttackTimer[0] = null; }
  if (_wbAttackTimer[1]) { clearTimeout(_wbAttackTimer[1]);  _wbAttackTimer[1] = null; }
  var s1 = _wbSt[1].score, s2 = _wbSt[2].score;
  var winner = s1 > s2 ? 1 : s2 > s1 ? 2 : 0;
  var loser  = winner === 1 ? 2 : winner === 2 ? 1 : 0;
  if (loser > 0) _wbPlayDead(loser); else { _wbPlayDead(1); _wbPlayDead(2); }

  if (window.GameBridge && typeof window.GameBridge.finishGame === 'function') {
    var p1Score = s1 * 10, p2Score = s2 * 10;
    var winningScore = Math.max(p1Score, p2Score);
    var maxScore = 1500;
    window.GameBridge.finishGame(winningScore, maxScore, [
      { player: 1, score: p1Score },
      { player: 2, score: p2Score }
    ], winner === 0 ? 'Draw' : ('Player ' + winner));
  }

  setTimeout(function() {
    var popup = document.getElementById('wbEndPopup');
    if (!popup) return;
    var eEl = popup.querySelector('.wb-end-emoji');
    var tEl = popup.querySelector('.wb-end-title');
    var sEl = popup.querySelector('.wb-end-scores');
    if (eEl) eEl.textContent = winner === 0 ? '🤝' : '🏆';
    if (tEl) {
      tEl.className = 'wb-end-title ' + (winner === 0 ? 'draw' : winner === 1 ? 'p1win' : 'p2win');
      tEl.style.animation = 'none';
      void tEl.offsetWidth; /* reflow to restart animation */
      tEl.style.animation = '';
      tEl.textContent = winner === 0 ? 'DRAW!' : 'PLAYER ' + winner + ' WINS!';
    }
    if (sEl) sEl.textContent = 'P1：' + s1 + ' 分  |  P2：' + s2 + ' 分';
    popup.classList.add('open');
  }, 1400);
}

/* ── Init ── */
function _wbInit(heroKey, enemyKey) {
  if (_wbTimerInterval) { clearInterval(_wbTimerInterval); _wbTimerInterval = null; }
  /* Reset state */
  _wbSt[1] = { score: 0, tiles: [], selectedIdx: [] };
  _wbSt[2] = { score: 0, tiles: [], selectedIdx: [] };
  _wbPendingRefill = [null, null];
  _wbAttacking     = [false, false];
  _wbAvatarState   = ['idle', 'idle'];
  _wbGameOver      = false;
  if (_wbAttackTimer[0]) { clearTimeout(_wbAttackTimer[0]); _wbAttackTimer[0] = null; }
  if (_wbAttackTimer[1]) { clearTimeout(_wbAttackTimer[1]); _wbAttackTimer[1] = null; }
  /* Scores */
  var s1 = document.getElementById('wbScore1'), s2 = document.getElementById('wbScore2');
  if (s1) s1.textContent = '0'; if (s2) s2.textContent = '0';
  /* Names — scene corners + score centre */
  var hn = document.getElementById('wbHeroName'),  en  = document.getElementById('wbEnemyName');
  var sn1 = document.getElementById('wbSCName1'), sn2 = document.getElementById('wbSCName2');
  var hName = BATTLE_NAMES[heroKey]  || heroKey;
  var eName = BATTLE_NAMES[enemyKey] || enemyKey;
  if (hn)  hn.textContent  = hName;
  if (en)  en.textContent  = eName;
  if (sn1) sn1.textContent = hName;
  if (sn2) sn2.textContent = eName;
  /* Reset character positions */
  ['wbHeroWrap','wbEnemyWrap'].forEach(function(id){
    var w = document.getElementById(id);
    if (w) { w.style.transform = ''; w.style.transition = ''; }
  });
  /* Hide end popup */
  var popup = document.getElementById('wbEndPopup');
  if (popup) popup.classList.remove('open');
  /* Build word sets */
  _wbBuildWordSets();
  /* Start avatars */
  _wbStartAvatar(1, heroKey);
  _wbStartAvatar(2, enemyKey);
  /* Fill & render grids */
  _wbFillGrid(1); _wbFillGrid(2);
  _wbRenderGrid(1); _wbRenderGrid(2);
  _wbRenderFloat(1); _wbRenderFloat(2);
  _wbUpdateGlow(1); _wbUpdateGlow(2);
  /* Start countdown */
  _wbStartTimer();
}

/* ══════════════════════════════════════════════════════════════════
   OVERLAY OPEN / CLOSE
══════════════════════════════════════════════════════════════════ */

/* Open — always starts at mode/level select */
function btlOpen() {
  var el = document.getElementById('battleOverlay');
  if (!el) return;
  el.classList.add('open');
  document.getElementById('btlModeSelect').style.display = 'flex';
  document.getElementById('btlHeroSelect').style.display = 'none';
  document.getElementById('btlArena').style.display      = 'none';
  document.getElementById('btlResult').style.display     = 'none';
  /* Show the floating ✕ on mode/hero-select screens (no in-arena exit btn) */
  var closeBtn = document.getElementById('btlClose');
  if (closeBtn) closeBtn.style.display = '';
  _msSetMode(_wbMode);
  if (_wbLevel === 'MH_MULTI') {
    /* MH multi-select: restore unit button states without clearing _wbMHUnits */
    document.querySelectorAll('.ms-level-btn:not(.mh-unit-btn)').forEach(function(b) {
      b.classList.remove('active');
    });
    document.querySelectorAll('.mh-unit-btn').forEach(function(btn) {
      var m = (btn.getAttribute('onclick') || '').match(/'([^']+)'/);
      var key = m ? m[1] : '';
      btn.classList.toggle('active', _wbMHUnits.indexOf(key) !== -1);
    });
    var badge = document.getElementById('mhWbBadge');
    if (badge) badge.textContent = _wbMHUnits.length
      ? '(' + _wbMHUnits.length + ' unit' + (_wbMHUnits.length > 1 ? 's' : '') + ' selected)' : '';
  } else {
    _msSetLevel(_wbLevel);
  }
  /* Restore timer slider to last chosen value */
  var slider = document.getElementById('msTimerSlider');
  if (slider) {
    slider.value = _wbTimeLimitSec;
    _msUpdateTimer(_wbTimeLimitSec);
  }
}

/* Hero select confirmed → launch word builder */
function btlStartBattle(heroKey, enemyKey) {
  GameAudio.playClick();
  if (_hs1RAF) { cancelAnimationFrame(_hs1RAF); _hs1RAF = null; }
  if (_hs2RAF) { cancelAnimationFrame(_hs2RAF); _hs2RAF = null; }
  document.getElementById('btlHeroSelect').style.display = 'none';
  document.getElementById('btlArena').style.display      = 'flex';
  document.getElementById('btlResult').style.display     = 'none';
  /* Keep global floating ✕ and 🔊 visible */
  var globalControls = document.getElementById('btlGlobalControls');
  if (globalControls) globalControls.style.display = 'flex';
  var closeBtn = document.getElementById('btlClose');
  if (closeBtn) closeBtn.style.display = 'flex';
  /* Apply a random full-screen background */
  var _bgCount   = 4;
  var _bgIdx     = Math.floor(Math.random() * _bgCount) + 1;
  var _bgUrl     = 'bg/game_background_' + _bgIdx + '.png';
  var _bgOverlay = document.getElementById('battleOverlay');
  if (_bgOverlay) _bgOverlay.style.backgroundImage = 'url("' + _bgUrl + '")';
  GameAudio.startBGM();
  _wbInit(heroKey, enemyKey);
}

/* Restart → back to mode select or replay */
function btlRestart() {
  var popup = document.getElementById('wbEndPopup');
  if (popup) popup.classList.remove('open');
  if (Array.isArray(_customWordDb) && _customWordDb.length > 0) {
    var p1Key = _hsSelectedHero[0] || 'hero1';
    var p2Key = _hsSelectedHero[1] || 'hero2';
    btlStartBattle(p1Key, p2Key);
  } else {
    btlOpen();
  }
}

/* Close / exit */
function btlClose() {
  /* Cancel timer */
  if (_wbTimerInterval) { clearInterval(_wbTimerInterval); _wbTimerInterval = null; }
  _wbGameOver = true;
  /* Cancel all RAF loops */
  if (_wbAvatarRAF[0]) { cancelAnimationFrame(_wbAvatarRAF[0]); _wbAvatarRAF[0] = null; }
  if (_wbAvatarRAF[1]) { cancelAnimationFrame(_wbAvatarRAF[1]); _wbAvatarRAF[1] = null; }
  if (_hs1RAF) { cancelAnimationFrame(_hs1RAF); _hs1RAF = null; }
  if (_hs2RAF) { cancelAnimationFrame(_hs2RAF); _hs2RAF = null; }
  /* Cancel attack timers */
  if (_wbAttackTimer[0]) { clearTimeout(_wbAttackTimer[0]); _wbAttackTimer[0] = null; }
  if (_wbAttackTimer[1]) { clearTimeout(_wbAttackTimer[1]); _wbAttackTimer[1] = null; }
  /* Reset character wrap positions */
  ['wbHeroWrap','wbEnemyWrap'].forEach(function(id){
    var w = document.getElementById(id);
    if (w) { w.style.transform = ''; w.style.transition = ''; }
  });
  var el = document.getElementById('battleOverlay');
  if (el) el.classList.remove('open');
}

/* ─────────────────────────────────────────── */

function spriteTestOpen() {
  var el = document.getElementById('spriteTestOverlay');
  if (el) el.classList.add('open');
  sptPlay('idle');          /* start on idle */
}

function spriteTestClose() {
  var el = document.getElementById('spriteTestOverlay');
  if (el) el.classList.remove('open');
  _sptRunning = false;
  if (_sptRAF) { cancelAnimationFrame(_sptRAF); _sptRAF = null; }
}
</script>

/* Override btlClose so ✕ button goes back to index.html */

function btlClose() {
  GameAudio.stopBGM();
  GameAudio.playClick();
  var el = document.getElementById('battleOverlay');
  if (el) el.classList.remove('open');
  /* Cancel any running animations */
  if (_hs1RAF) { cancelAnimationFrame(_hs1RAF); _hs1RAF = null; }
  if (_hs2RAF) { cancelAnimationFrame(_hs2RAF); _hs2RAF = null; }
  ['wbHeroWrap','wbEnemyWrap'].forEach(function(id){
    var w = document.getElementById(id);
    if (w) { w.style.transform = ''; w.style.transition = ''; }
  });
  safeExitGame();
}

function _scaleBuilderBattle() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var s = Math.min(vw / 1920, vh / 1080);
  var scenes = [
    document.getElementById('btlHeroSelect'),
    document.getElementById('btlArena'),
    document.getElementById('btlResult')
  ];
  scenes.forEach(function(el) {
    if (!el) return;
    el.style.transform = 'scale(' + s + ')';
  });
}
window.addEventListener('resize', _scaleBuilderBattle);
_scaleBuilderBattle();

/* Open battle immediately on page load */
btlOpen();

/* LotusGameBridge Integration */
if (window.GameBridge && typeof window.GameBridge.onReady === 'function') {
  window.GameBridge.onReady(function(activity) {
    if (activity) {
      _initCustomQuestions(activity);
      _wbBuildWordSets();
      if (_wbSt[1] && _wbSt[1].tiles && _wbSt[1].tiles.length > 0) {
        _wbDealBoard(1);
        _wbDealBoard(2);
      }
    }
  });
}
</script>
