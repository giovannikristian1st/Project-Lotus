<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Group Sort — LotusWall</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="common/ui-spritesheet.css">
  <link rel="stylesheet" href="common/themes.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
    body { background: #f7f5f0; min-height: 100vh; color: #18181b; display: flex; flex-direction: column; overflow-x: hidden; }

    .top-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 14px 24px; background: #fcfbf8; border-bottom: 1.5px solid #d6cfc2; }
    .stat-badge { background: #ffffff; color: #18181b; border: 1.5px solid #d6cfc2; padding: 7px 14px; border-radius: 8px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 0 #e5dfd3; }
    .hearts { color: #dc2626; font-size: 16px; gap: 4px; }
    .heart { display: inline-flex; align-items: center; justify-content: center; }
    .heart.lost { opacity: 0.25; filter: grayscale(1); }

    .game-area { flex: 1; width: 96%; max-width: 1520px; margin: 0 auto; padding: 20px 28px; display: flex; flex-direction: column; gap: 22px; }

    /* Category Buckets */
    .buckets-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
    @media (max-width: 640px) {
      .game-area { width: 100%; padding: 14px; }
      .buckets-grid { grid-template-columns: 1fr; gap: 16px; }
    }
    .bucket {
      background: #ffffff;
      border: 2px dashed #c9c1b2;
      border-radius: 12px;
      padding: 18px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.15s;
      color: #18181b;
    }
    .bucket.drag-over { background: #eff6ff; border-color: #1d4ed8; transform: scale(1.01); }
    .bucket-title { font-size: 17px; font-weight: 800; color: #18181b; margin-bottom: 14px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .bucket-items { display: flex; flex-direction: column; gap: 8px; width: 100%; }

    /* Active Card to Sort */
    .deck-area {
      background: #fcfbf8;
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #d6cfc2;
      box-shadow: 0 3px 10px rgba(24, 24, 27, 0.04);
    }
    .deck-prompt { font-size: 12px; text-transform: uppercase; color: #57534e; font-weight: 800; letter-spacing: 1.2px; margin-bottom: 12px; }
    .active-card {
      background: #1d4ed8;
      border: 1.5px solid #1e3a8a;
      border-bottom: 4px solid #1e3a8a;
      border-radius: 12px;
      padding: 22px 32px;
      color: #ffffff;
      font-size: 21px;
      font-weight: 800;
      text-align: center;
      cursor: grab;
      box-shadow: 0 6px 16px rgba(24, 24, 27, 0.12);
      max-width: 680px;
      width: 100%;
    }
    .active-card:active { cursor: grabbing; transform: scale(1.02); }

    .placed-pill {
      background: #ffffff;
      color: #18181b;
      border: 1.5px solid #d6cfc2;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 4px rgba(24, 24, 27, 0.04);
    }

    .category-btns-mobile { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
    .cat-btn { background: #ffffff; border: 1.5px solid #d6cfc2; border-bottom: 3px solid #c9c1b2; color: #18181b; padding: 10px 20px; border-radius: 9px; font-weight: 700; cursor: pointer; transition: all 0.12s; font-size: 14px; }
    .cat-btn:hover { background: #eff6ff; border-color: #1d4ed8; border-bottom-color: #1e3a8a; color: #1d4ed8; transform: translateY(-1px); }

    .screen-overlay { position: fixed; inset: 0; background: rgba(24, 24, 27, 0.72); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; padding: 24px; }
    .end-box { background: #ffffff; color: #18181b; border: 1.5px solid #d6cfc2; border-bottom: 4px solid #c9c1b2; border-radius: 14px; padding: 36px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 20px 45px rgba(24, 24, 27, 0.22); }
    .end-sub { color: #57534e; margin-bottom: 20px; font-size: 14px; }
    .end-score-box { background: #fcfbf8; border: 1.5px solid #e5dfd3; padding: 18px; border-radius: 10px; margin-bottom: 20px; }
    .action-btn { background: #1d4ed8; color: #ffffff; border: none; border-bottom: 3px solid #1e3a8a; padding: 12px 30px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; transition: transform 0.12s, background 0.15s; }
    .action-btn:hover { background: #1e40af; transform: translateY(-1px); }
  </style>
</head>
<body class="theme-white">

  <div class="top-bar">
    <div class="stat-badge">
      <span class="ui-sprite ui-sm ui-folder hud-icon-white"></span>
      <span id="hdr-title">Group Sort</span>
    </div>
    <div class="stat-badge" id="score-badge">
      <span class="ui-sprite ui-sm ui-trophy hud-icon-white"></span>
      <span><span id="lbl-score">Score</span>: <span id="score-val">0</span></span>
    </div>
    <div class="stat-badge" id="timer-badge" style="display: none;">
      <span class="ui-sprite ui-sm ui-clock hud-icon-white"></span>
      <span><span id="lbl-time">Time</span>: <span id="timer-val">0</span>s</span>
    </div>
    <div class="stat-badge" id="cards-left">Left: 4 Cards</div>
    <div class="stat-badge hearts" id="lives-container" style="display: none;"></div>
  </div>

  <main class="game-area">
    <!-- Category Buckets -->
    <div class="buckets-grid" id="buckets-grid"></div>

    <!-- Active Card -->
    <div class="deck-area">
      <div class="deck-prompt" id="prompt-title">Card to Sort:</div>
      <div class="active-card" id="active-card" draggable="true">...</div>
      <div class="category-btns-mobile" id="mobile-buttons"></div>
    </div>
  </main>

  <div class="screen-overlay" id="end-screen" style="display: none;">
    <div class="end-box">
      <div style="margin-bottom: 14px; display: flex; justify-content: center;">
        <span class="ui-sprite ui-2xl ui-trophy"></span>
      </div>
      <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 8px;" id="end-title">All cards sorted cleanly!</h2>
      <p class="end-sub" id="end-sub">Awesome, every card landed in the matching bucket!</p>

      <div class="end-score-box">
        <div style="font-size: 36px; font-weight: 800; color: #15803d;" id="final-score">0 Points</div>
      </div>

      <button class="action-btn" onclick="initGame()">
        <span class="ui-sprite ui-sm ui-refresh hud-icon-white"></span>
        <span id="play-again-text">Play Again</span>
      </button>
    </div>
  </div>

  <script src="common/sfx.js"></script>
  <script src="common/confetti.js"></script>
  <script src="common/i18n.js"></script>
  <script src="common/themes.js"></script>
  <script src="common/bridge.js"></script>
  <script>
    const tr = (key, vars) => (window.LotusI18n ? window.LotusI18n.t(key, vars) : key);

    let activity = null;
    let items = [];
    let categories = [];
    let currentIndex = 0;
    let score = 0;
    let maxLives = 0;
    let lives = 0;
    let timeMode = 'none';
    let timerDuration = 60;
    let timeLeft = 60;
    let stopwatchSeconds = 0;
    let timerInterval = null;
    let isGameOver = false;
    let lastEndMode = 'win';
    let hasBootedOnce = false;
    let lastActivitySig = '';
    let lastSettingsSyncTs = 0;
    const processedBridgeMsgs = new WeakSet();

    function applyTranslations() {
      const titleEl = document.getElementById('page-title');
      if (titleEl) titleEl.textContent = tr('gs.pageTitle');
      document.title = tr('gs.pageTitle');

      const hdrTitle = document.getElementById('hdr-title');
      if (hdrTitle) hdrTitle.textContent = tr('gs.title');

      const lblScore = document.getElementById('lbl-score');
      if (lblScore) lblScore.textContent = tr('game.score');

      const lblTime = document.getElementById('lbl-time');
      if (lblTime) lblTime.textContent = timeMode === 'stopwatch' ? tr('game.stopwatch') : tr('game.time');

      const cardsLeftEl = document.getElementById('cards-left');
      if (cardsLeftEl) cardsLeftEl.textContent = tr('gs.cardsLeftBadge', { n: Math.max(0, items.length - currentIndex) });

      const promptTitle = document.getElementById('prompt-title');
      if (promptTitle) promptTitle.textContent = tr('gs.promptTitle');

      document.querySelectorAll('#mobile-buttons .cat-btn').forEach(btn => {
        if (btn.dataset.cat) btn.textContent = tr('gs.chooseBtn', { cat: btn.dataset.cat });
      });

      const endTitle = document.getElementById('end-title');
      if (endTitle) {
        endTitle.textContent = lastEndMode === 'lives'
          ? tr('game.outOfLivesTitle')
          : lastEndMode === 'timeout'
            ? tr('game.timesUp')
            : tr('gs.allSorted');
      }

      const endSub = document.getElementById('end-sub');
      if (endSub) endSub.textContent = lastEndMode === 'lives' ? tr('game.outOfLivesSub') : tr('gs.allSortedSub');

      const finalScore = document.getElementById('final-score');
      if (finalScore) finalScore.textContent = tr('game.totalPoints', { n: score });

      const playAgainText = document.getElementById('play-again-text');
      if (playAgainText) playAgainText.textContent = tr('game.playAgain');
    }

    if (window.LotusI18n) {
      window.LotusI18n.onChange(() => applyTranslations());
    }

    const bridge = window.GameBridge || (typeof GameBridge !== 'undefined' ? GameBridge : null);

    function computeActivitySig(act) {
      if (!act) return '';
      const qLen = (act.questions || act.content?.items || []).length;
      return JSON.stringify({
        id: act.id || '',
        title: act.title || '',
        qLen,
        rules: act.rules || null,
        settings: act.settings || null,
        theme: act.theme || ''
      });
    }

    function applyMergedSettings(payload) {
      if (!payload) return;
      const base = payload.activity ? { ...payload.activity } : { ...(activity || {}) };
      if (payload.rules) base.rules = { ...(base.rules || {}), ...payload.rules };
      if (payload.settings) base.settings = { ...(base.settings || {}), ...payload.settings };
      if (payload.theme) base.theme = payload.theme;
      if (base.rules) {
        base.settings = {
          ...(base.settings || {}),
          timerSeconds: base.rules.timerSeconds ?? base.settings?.timerSeconds ?? 60,
          lives: base.rules.hasLives === false ? 0 : (base.rules.livesCount ?? base.settings?.lives ?? 3),
          hasLives: base.rules.hasLives,
          timeMode: base.rules.timeMode,
          shuffle: base.rules.shuffleQuestions,
          shuffleAnswers: base.rules.shuffleAnswers
        };
      }
      const norm = (bridge && typeof bridge.normalizeActivity === 'function') ? bridge.normalizeActivity(base) : base;
      activity = norm;
      if (bridge) bridge.activity = norm;
      lastActivitySig = computeActivitySig(norm);
      if (payload.theme && window.LotusThemes) LotusThemes.apply(payload.theme, true);
      else if (norm.theme && window.LotusThemes) LotusThemes.apply(norm.theme);
      if (payload.restart !== false) initGame();
    }

    function handleExternalMessage(data) {
      if (!data || typeof data !== 'object') return;
      if (data.type === 'GAME_CMD') {
        const cmd = data.command || data.cmd;
        if (cmd === 'RESTART') initGame();
      } else if (data.type === 'UPDATE_SETTINGS') {
        lastSettingsSyncTs = Date.now();
        applyMergedSettings(data);
      } else if (data.type === 'GAME_SETTINGS') {
        lastSettingsSyncTs = Date.now();
        const p = data.payload && typeof data.payload === 'object' ? { ...data, ...data.payload } : data;
        if (p.rules || p.settings || p.activity || p.theme) applyMergedSettings(p);
      } else if (data.type === 'INIT_ACTIVITY' && data.activity) {
        const norm = (bridge && typeof bridge.normalizeActivity === 'function') ? bridge.normalizeActivity(data.activity) : data.activity;
        const sig = computeActivitySig(norm);
        if (!hasBootedOnce || sig !== lastActivitySig || data.forceRestart || data.restart === true) {
          activity = norm;
          if (bridge) bridge.activity = norm;
          lastActivitySig = sig;
          hasBootedOnce = true;
          initGame();
        }
      }
    }

    if (bridge && typeof bridge.onReady === 'function') {
      bridge.onReady((act) => {
        if (hasBootedOnce && (Date.now() - lastSettingsSyncTs) < 50) return;
        activity = act;
        lastActivitySig = computeActivitySig(act);
        hasBootedOnce = true;
        initGame();
      });
      if (typeof bridge.onSettings === 'function') {
        bridge.onSettings((payload) => {
          if (payload && typeof payload === 'object') processedBridgeMsgs.add(payload);
          handleExternalMessage(payload);
        });
      }
    } else {
      setTimeout(() => { hasBootedOnce = true; initGame(); }, 100);
    }

    const hasBridgeSettings = Boolean(bridge && typeof bridge.onSettings === 'function');
    window.addEventListener('message', (event) => {
      if (!event.data || typeof event.data !== 'object') return;
      if (processedBridgeMsgs.has(event.data)) return;
      if (hasBridgeSettings && (event.data.type === 'UPDATE_SETTINGS' || event.data.type === 'GAME_SETTINGS' || event.data.type === 'GAME_CMD')) {
        return;
      }
      processedBridgeMsgs.add(event.data);
      handleExternalMessage(event.data);
    });

    function initGame() {
      clearInterval(timerInterval);
      isGameOver = false;
      lastEndMode = 'win';

      const lang = window.LotusI18n ? window.LotusI18n.getLang() : 'en';
      const rawItems = activity?.questions || activity?.content?.items || [];
      items = [...rawItems].filter(i => (i.question || i.text || i.word || i.correctAnswer));

      if (items.length === 0) {
        items = lang === 'id'
          ? [
              { question: "Kucing", category: "Mamalia" },
              { question: "Paus", category: "Mamalia" },
              { question: "Elang", category: "Burung" },
              { question: "Merpati", category: "Burung" }
            ]
          : [
              { question: "Cat", category: "Mammals" },
              { question: "Whale", category: "Mammals" },
              { question: "Eagle", category: "Birds" },
              { question: "Dove", category: "Birds" }
            ];
      }

      const rules = activity?.rules || {};
      const settings = activity?.settings || {};

      if (rules.shuffleQuestions !== false && settings.shuffle !== false) {
        items.sort(() => Math.random() - 0.5);
      }

      const catSet = new Set();
      items.forEach(i => {
        catSet.add(i.category || i.correctAnswer || tr('gs.defaultCat'));
      });
      categories = Array.from(catSet);
      if (categories.length === 1) categories.push(tr('gs.otherCat'));
      if (rules.shuffleAnswers !== false && settings.shuffleAnswers !== false) {
        categories.sort(() => Math.random() - 0.5);
      }

      const hasLives = rules.hasLives !== undefined
        ? Boolean(rules.hasLives)
        : (settings.hasLives !== undefined ? Boolean(settings.hasLives) : (settings.lives !== undefined ? Number(settings.lives) > 0 : false));
      maxLives = hasLives ? (Number(rules.livesCount ?? settings.lives ?? 3) || 3) : 0;
      lives = maxLives;

      timeMode = rules.timeMode || (settings.timerSeconds > 0 ? 'timer' : 'none');
      timerDuration = Number(rules.timerSeconds ?? settings.timerSeconds ?? 60);
      if (timerDuration <= 0 && timeMode === 'timer') timerDuration = 60;
      timeLeft = timerDuration;
      stopwatchSeconds = 0;

      if (window.LotusThemes) LotusThemes.apply(activity?.theme || 'white');

      currentIndex = 0;
      score = 0;
      document.getElementById('score-val').innerText = score;
      document.getElementById('end-screen').style.display = 'none';

      const timerBadge = document.getElementById('timer-badge');
      const timerVal = document.getElementById('timer-val');
      if (timeMode === 'none') {
        if (timerBadge) timerBadge.style.setProperty('display', 'none', 'important');
      } else if (timeMode === 'stopwatch') {
        if (timerBadge) {
          timerBadge.style.removeProperty('display');
          timerBadge.style.display = 'inline-flex';
        }
        if (timerVal) timerVal.innerText = '0';
        timerInterval = setInterval(() => {
          stopwatchSeconds++;
          if (timerVal) timerVal.innerText = String(stopwatchSeconds);
        }, 1000);
      } else {
        if (timerBadge) {
          timerBadge.style.removeProperty('display');
          timerBadge.style.display = 'inline-flex';
        }
        if (timerVal) timerVal.innerText = String(timeLeft);
        timerInterval = setInterval(() => {
          timeLeft--;
          if (timerVal) timerVal.innerText = String(Math.max(0, timeLeft));
          if (timeLeft <= 5 && timeLeft > 0 && window.SFX && SFX.tick) SFX.tick();
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            endGame('timeout');
          }
        }, 1000);
      }

      updateHearts();
      renderBuckets();
      loadActiveCard(0);
      applyTranslations();
    }

    function updateHearts() {
      const container = document.getElementById('lives-container');
      if (!container) return;
      if (maxLives <= 0) {
        container.style.setProperty('display', 'none', 'important');
        container.innerHTML = '';
        return;
      }
      container.style.removeProperty('display');
      container.style.display = 'inline-flex';
      let str = '';
      for (let i = 0; i < maxLives; i++) {
        const lostCls = i < lives ? '' : ' lost';
        str += `<span class="heart${lostCls}"><span class="ui-sprite ui-sm ui-heart hud-icon-white"></span></span>`;
      }
      container.innerHTML = str;
    }

    function renderBuckets() {
      const grid = document.getElementById('buckets-grid');
      const mobileBtns = document.getElementById('mobile-buttons');
      grid.innerHTML = '';
      mobileBtns.innerHTML = '';

      categories.forEach((cat, idx) => {
        const bucket = document.createElement('div');
        bucket.className = 'bucket';
        bucket.id = `bucket-${idx}`;
        bucket.innerHTML = `
          <div class="bucket-title">
            <span class="ui-sprite ui-md ui-folder hud-icon-white"></span>
            <span>${cat}</span>
          </div>
          <div class="bucket-items" id="bucket-items-${idx}"></div>
        `;

        bucket.ondragover = (e) => {
          e.preventDefault();
          bucket.classList.add('drag-over');
        };
        bucket.ondragleave = () => bucket.classList.remove('drag-over');
        bucket.ondrop = (e) => {
          e.preventDefault();
          bucket.classList.remove('drag-over');
          dropIntoCategory(cat, idx);
        };

        grid.appendChild(bucket);

        const btn = document.createElement('button');
        btn.className = 'cat-btn category-btn';
        btn.dataset.cat = cat;
        btn.innerText = tr('gs.chooseBtn', { cat });
        btn.onclick = () => dropIntoCategory(cat, idx);
        mobileBtns.appendChild(btn);
      });
    }

    function loadActiveCard(index) {
      if (index >= items.length) {
        endGame('win');
        return;
      }

      document.getElementById('cards-left').innerText = tr('gs.cardsLeftBadge', { n: items.length - index });
      const item = items[index];
      const cardEl = document.getElementById('active-card');
      cardEl.innerText = item.question || item.text || item.word || item.correctAnswer;

      cardEl.ondragstart = (e) => {
        if (window.SFX) SFX.click();
        e.dataTransfer.setData('text/plain', 'card');
      };
    }

    function dropIntoCategory(selectedCat, bucketIdx) {
      if (isGameOver || currentIndex >= items.length) return;
      const item = items[currentIndex];
      const correctCat = item.category || item.correctAnswer;
      const isCorrect = (selectedCat === correctCat);

      const itemsContainer = document.getElementById(`bucket-items-${bucketIdx}`);
      const pill = document.createElement('div');
      pill.className = 'placed-pill';
      pill.innerHTML = `<span>${item.question || item.text || item.word || item.correctAnswer}</span> <span class="ui-sprite ui-xs ${isCorrect ? 'ui-check' : 'ui-close'}"></span>`;
      if (isCorrect) pill.style.border = '1.5px solid #10b981';
      else pill.style.border = '1.5px solid #ef4444';
      itemsContainer.appendChild(pill);

      if (isCorrect) {
        if (window.SFX) SFX.correct();
        score += 100;
        document.getElementById('score-val').innerText = score;
      } else {
        if (window.SFX) SFX.wrong();
        if (maxLives > 0) {
          lives = Math.max(0, lives - 1);
          updateHearts();
          if (lives <= 0) {
            currentIndex++;
            document.getElementById('cards-left').innerText = tr('gs.cardsLeftBadge', { n: Math.max(0, items.length - currentIndex) });
            endGame('lives');
            return;
          }
        }
      }

      currentIndex++;
      loadActiveCard(currentIndex);
    }

    function endGame(mode = 'win') {
      if (isGameOver) return;
      isGameOver = true;
      lastEndMode = mode || 'win';
      clearInterval(timerInterval);
      if (lastEndMode === 'win') {
        if (window.SFX) SFX.win();
        if (window.launchConfetti) window.launchConfetti();
      } else {
        if (window.SFX) SFX.wrong();
      }
      GameBridge.finishGame(score, items.length * 100);
      applyTranslations();
      document.getElementById('final-score').innerText = tr('game.totalPoints', { n: score });
      document.getElementById('end-screen').style.display = 'flex';
    }
  </script>
</body>
</html>
